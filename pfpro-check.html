<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日用帳 · PF Pro 對照自檢</title>
<style>
  body { font-family: "Noto Sans TC", "PingFang TC", sans-serif; margin: 0; background: #efe7db; color: #221c18; }
  main { width: min(640px, 100%); margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; }
  p { line-height: 1.5; }
  li { margin: 6px 0; }
  .ok { color: #0c7a58; }
  .bad { color: #9f2d2d; }
  a { color: #1e4fd7; }
</style>
</head>
<body>
<main>
  <h1>PF Pro 對照自檢</h1>
  <p>檢查分類對照、繳卡費、代墊、朋友還錢、離線佇列的 request_id、重試間隔、已作廢修改不再重試，以及台北時間 ISO。不連線、不讀 API key。</p>
  <p id="summary">執行中…</p>
  <ul id="list"></ul>
  <p><a href="index.html">回到日用帳</a></p>
</main>
<script src="pfpro.js"></script>
<script>
var list = document.getElementById("list");
var summary = document.getElementById("summary");
if (!window.PfPro || typeof window.PfPro.selfCheck !== "function") {
  summary.textContent = "載入 pfpro.js 失敗。";
} else {
  var result = window.PfPro.selfCheck();
  result.cases.forEach(function (item) {
    var li = document.createElement("li");
    li.className = item.ok ? "ok" : "bad";
    li.textContent = (item.ok ? "通過" : "失敗") + " · " + item.name + (item.detail && !item.ok ? " · " + item.detail : "");
    list.appendChild(li);
  });
  var failed = result.cases.filter(function (item) { return !item.ok; }).length;
  summary.textContent = failed ? (failed + " 項失敗") : (result.cases.length + " 項都通過");
}
</script>
</body>
</html>
