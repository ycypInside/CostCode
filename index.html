<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="記帳">
<title>記帳</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c1e21;--sub:#6b7280;--line:#e5e7eb;--accent:#2563eb;--inc:#16a34a;--exp:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d23;--text:#e8eaed;--sub:#9aa0a6;--line:#2a2e36;--accent:#60a5fa;--inc:#4ade80;--exp:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--sub);padding:12px 0;font-size:14px}
nav button.on{color:var(--accent);font-weight:600}
input,select,button,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:2px 0 8px}
button.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 14px}
button.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button.danger{background:var(--exp);color:#fff;border:0;border-radius:8px;padding:9px 14px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.sub{color:var(--sub);font-size:13px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.tx{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.day{font-size:13px;color:var(--sub);padding:8px 0 2px}
.bar{height:6px;background:var(--accent);border-radius:3px;margin-top:3px;opacity:.7}
.hidden{display:none}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);width:min(92vw,460px);padding:16px}
dialog::backdrop{background:#0008}
pre{white-space:pre-wrap;font-size:12px;background:var(--bg);padding:8px;border-radius:8px;max-height:200px;overflow:auto}
.ic{width:36px;height:36px;border-radius:18px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:none}.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#fAmount{font-size:30px;font-weight:600;text-align:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:1px solid var(--line);border-radius:10px;background:none;font-size:12px}
.cat span{font-size:22px}.cat.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{padding:5px 11px;border:1px solid var(--line);border-radius:16px;background:none;font-size:13px}.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.lbl{font-size:12px;color:var(--sub);margin:4px 0}
#formDlg{max-height:92vh;overflow:auto}
#status{font-size:12px;color:var(--sub);text-align:right;margin:0 4px 6px}
.proj{cursor:pointer}.proj b{font-size:17px}
.prog{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:4px 0}.prog i{display:block;height:100%;border-radius:4px}
.be{fill:var(--exp)}.bi{fill:var(--inc);opacity:.75}.tl{fill:var(--sub);font-size:10px;text-anchor:middle}.tl.on{fill:var(--accent);font-weight:700}
input[type=search]{-webkit-appearance:none}
table{width:100%;border-collapse:collapse}td{padding:4px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right}
</style>
</head>
<body>
<main>
  <section id="tab-list">
    <div id="status"></div>
    <input id="q" type="search" placeholder="🔍 搜尋備註、分類、專案、發票品項、金額">
    <div class="card row" id="monthCard">
      <button class="ghost" id="prev">‹</button>
      <input type="month" id="month" class="grow" style="margin:0">
      <button class="ghost" id="next">›</button>
    </div>
    <div class="card row" style="justify-content:space-around">
      <div>收入<br><b class="inc" id="sumInc">0</b></div>
      <div>支出<br><b class="exp" id="sumExp">0</b></div>
      <div>結餘<br><b id="sumNet">0</b></div>
    </div>
    <div id="budgetMini"></div>
    <div class="card" id="list"></div>
  </section>

  <section id="tab-stats" class="hidden">
    <div class="card" id="budgetCard"></div>
    <div class="card"><h2>近 12 個月收支</h2><div id="trend"></div></div>
    <div class="card"><h2 id="catTitle">本月支出分類</h2><div id="catStats"></div></div>
  </section>

  <section id="tab-projects" class="hidden"><div id="projList"></div></section>

  <section id="tab-settings" class="hidden">
    <div class="card">
      <h2>連線設定</h2>
      <label class="sub">Apps Script 網頁應用程式網址 (結尾為 /exec)</label>
      <input id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec">
      <label class="sub">TOKEN（與 Script Properties 中設定的相同）</label>
      <input id="cfgToken" type="password">
      <button class="btn" id="saveCfg">儲存並連線</button>
      <p class="sub" id="cfgMsg"></p>
    </div>  
    <div class="card">
      <h2>匯入 CostDiary 備份 (.cddb)</h2>
      <p class="sub">檔案只會在你的瀏覽器中解析，再傳到你自己的 Google Sheet / Drive。</p>
      <input type="file" id="file">
      <pre id="importLog">尚未選擇檔案</pre>
      <label class="row"><input type="checkbox" id="wipe" checked style="width:auto;margin:0"> 上傳前先清空 Sheet 現有資料（避免重複匯入）</label>
      <p><button class="btn" id="upload" disabled>上傳到 Google Sheet</button></p>
    </div>
  </section>
</main>

<nav>
  <button data-tab="list" class="on">明細</button>
  <button data-tab="stats">統計</button>
  <button data-tab="projects">專案</button>
  <button data-tab="settings">設定</button>
</nav>
<button class="btn" id="fab" style="position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:26px;font-size:26px;padding:0">＋</button>

<dialog id="formDlg">
  <div class="seg"><button type="button" id="fTypeExp">支出</button><button type="button" id="fTypeInc">收入</button></div>
  <input id="fAmount" type="number" inputmode="decimal" placeholder="0">
  <div class="lbl" id="fFreqLbl">常用</div><div class="chips" id="fFreq"></div>
  <div class="lbl">分類</div><div class="grid" id="fGrid"></div>
  <div class="chips" id="fSub"></div>
  <input id="fDate" type="date">
  <select id="fAcc"></select>
  <select id="fProj"></select>
  <input id="fMemo" placeholder="備註">
  <div class="row"><button class="ghost" id="fCancel">取消</button><span class="grow"></span><button class="btn" id="fSave">儲存</button></div>
</dialog>

<dialog id="projDlg">
  <div id="projBody"></div>
  <div class="row" style="margin-top:12px"><span class="grow"></span><button class="ghost" id="pClose">關閉</button></div>
</dialog>

<dialog id="detailDlg">
  <div id="detailBody"></div>
  <div class="row" style="margin-top:12px">
    <button class="danger" id="dDelete">刪除</button><span class="grow"></span>
    <button class="ghost" id="dEdit">編輯</button><button class="ghost" id="dClose">關閉</button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script>
const SQLJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(n).toLocaleString('zh-TW');
const cfg = { url: localStorage.getItem('apiUrl') || '', token: localStorage.getItem('apiToken') || '' };

let D = { tx: [], accounts: [], projects: [], cats: [], items: [], settings: {} };
let query = '';
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
let curMonth = ymd(new Date()).slice(0, 7);
let editing = null, viewing = null, parsed = null;

/* ---------- API ---------- */
async function api(action, payload = {}) {
  if (!cfg.url) throw new Error('請先到「設定」填入網址');
  const res = await fetch(cfg.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // 避免 CORS preflight
    body: JSON.stringify({ token: cfg.token, action, ...payload })
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'API error');
  return j;
}

const TX_KEYS = ['uid','date','type','amount','accountId','class1','class2','projectId','memo','invoiceId','photoFileId','createdAt','modifiedAt'];
const txToRow = t => TX_KEYS.map(k => t[k] ?? '');
const rowToTx = r => Object.fromEntries(TX_KEYS.map((k, i) => [k, k === 'amount' ? Number(r[i]) : String(r[i] ?? '')]));

/* ---------- 離線快取 (IndexedDB) ---------- */
const idbOpen = () => new Promise((res, rej) => { const r = indexedDB.open('expense', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function cacheSet(k, v) { try { const db = await idbOpen(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch {} }
async function cacheGet(k) { try { const db = await idbOpen(); return await new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); } catch { return undefined; } }
const saveCache = () => cacheSet('data', { D, at: Date.now() });
const setStatus = t => { $('#status').textContent = t; };
const hhmm = ms => new Date(ms).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

async function loadAll() {
  setStatus('同步中…');
  try {
    const { data } = await api('all');
    D.tx = data.Transactions.map(rowToTx);
    D.accounts = data.Accounts.map(r => ({ id: String(r[0]), name: r[1] }));
    D.projects = data.Projects.map(r => ({ id: String(r[0]), name: r[1] }));
    D.cats = data.Categories.map(r => ({ id: String(r[0]), level: Number(r[1]), parent: String(r[2]), kind: r[3], name: r[4], icon: r[5], order: Number(r[6]) }))
                            .sort((a, b) => a.order - b.order);
    D.items = data.ReceiptItems;
    D.settings = Object.fromEntries((data.Settings || []).map(r => [String(r[0]), r[1]]));
    saveCache(); setStatus('已同步 ' + hhmm(Date.now()));
    render();
  } catch (e) {
    setStatus(D.tx.length ? '離線中，顯示上次同步的資料' : '連線失敗');
    throw e;
  }
}

/* ---------- 查表 ---------- */
const c1 = id => D.cats.find(c => c.level === 1 && c.id === String(id));
const c2 = id => D.cats.find(c => c.level === 2 && c.id === String(id));
const accName = id => D.accounts.find(a => a.id === String(id))?.name ?? '';
const projName = id => D.projects.find(p => p.id === String(id))?.name ?? '';
const ICONS = { i_class_finance: '💰', i_class_stock: '📈', i_class_food: '🍜', i_class_bus: '🚌', i_class_book: '📚', i_class_tshirt: '👕', i_class_game: '🎮', i_class_fine: '🧾', i_class_house: '🏠', i_class_gas: '⛽', i_class_health: '🏥', i_class_travel: '✈️', i_class_coin: '🪙', i_class_pet: '🐾', i_class_education: '🎓', i_class_gift: '🎁', i_class_mobile: '📱', i_class_office: '💼' };
const emojiOf = cat => ICONS[cat?.icon] || '🏷️';
const catLabel = t => [c1(t.class1)?.name, c2(t.class2)?.name].filter(Boolean).join(' › ') || '未分類';

/* ---------- 明細 / 統計 ---------- */
function monthTx() { return D.tx.filter(t => t.date.startsWith(curMonth)).sort((a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt)); }

const budget = () => Number(D.settings?.monthlyBudget) || 0;
let itemIdx = {}, itemIdxLen = -1;
function itemText(inv) {
  if (itemIdxLen !== D.items.length) { itemIdx = {}; D.items.forEach(r => { const k = String(r[0]); itemIdx[k] = (itemIdx[k] || '') + ' ' + r[4]; }); itemIdxLen = D.items.length; }
  return itemIdx[inv] || '';
}
function searchTx(q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  return D.tx.filter(t => {
    const hay = [t.memo, catLabel(t), projName(t.projectId), accName(t.accountId), t.invoiceId ? itemText(t.invoiceId) : '', t.amount, t.date].join(' ').toLowerCase();
    return terms.every(w => hay.includes(w));
  }).sort((a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt));
}

function budgetHtml(spent) {
  const b = budget();
  if (!b) return '<div class="sub">尚未設定月預算</div>';
  const pct = spent / b * 100, remain = b - spent;
  const color = pct > 100 ? 'var(--exp)' : pct > 80 ? '#f59e0b' : 'var(--inc)';
  let extra = '';
  const now = new Date();
  if (curMonth === ymd(now).slice(0, 7) && remain > 0) {
    const left = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() - now.getDate() + 1;
    extra = `，今天起每天可花 ${fmt(remain / left)}`;
  }
  return `<div class="row"><span class="grow">月預算 ${fmt(b)}</span><b style="color:${color}">${Math.round(pct)}%</b></div>
    <div class="prog"><i style="width:${Math.min(pct, 100)}%;background:${color}"></i></div>
    <div class="sub">已花 ${fmt(spent)}，${remain >= 0 ? '剩 ' + fmt(remain) : '超支 ' + fmt(-remain)}${extra}</div>`;
}

function renderTrend() {
  const sums = {};
  D.tx.forEach(t => { const m = t.date.slice(0, 7); const o = sums[m] ||= { inc: 0, exp: 0 }; o[t.type === 'income' ? 'inc' : 'exp'] += t.amount; });
  const now = new Date(), months = [];
  for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(ymd(d).slice(0, 7)); }
  const max = Math.max(1, ...months.flatMap(m => [sums[m]?.inc || 0, sums[m]?.exp || 0]));
  const H = 110;
  const bars = months.map((m, i) => {
    const o = sums[m] || { inc: 0, exp: 0 }, x = i * 30;
    const he = o.exp / max * H, hi = o.inc / max * H;
    return `<g data-month="${m}" style="cursor:pointer"><rect x="${x}" y="0" width="30" height="${H + 22}" fill="transparent"/>
      <rect class="bi" x="${x + 3}" y="${H - hi}" width="11" height="${hi}" rx="2"/>
      <rect class="be" x="${x + 15}" y="${H - he}" width="11" height="${he}" rx="2"/>
      <text class="tl ${m === curMonth ? 'on' : ''}" x="${x + 15}" y="${H + 14}">${Number(m.slice(5))}月</text></g>`;
  }).join('');
  const avg = months.reduce((s, m) => s + (sums[m]?.exp || 0), 0) / 12;
  $('#trend').innerHTML = `<svg viewBox="0 0 360 ${H + 22}" style="width:100%;height:auto">${bars}</svg>
    <div class="sub"><span class="inc">■</span> 收入　<span class="exp">■</span> 支出　· 近 12 個月平均支出 ${fmt(avg)}／月 · 點月份可跳轉</div>`;
}

function render() {
  $('#month').value = curMonth;
  const mlist = monthTx();
  const list = query ? searchTx(query) : mlist;
  const shown = query ? list.slice(0, 300) : list;
  const sum = (arr, type) => arr.filter(t => t.type === type).reduce((s, t) => s + t.amount, 0);
  const inc = sum(list, 'income'), exp = sum(list, 'expense'), mExp = sum(mlist, 'expense');
  $('#sumInc').textContent = fmt(inc); $('#sumExp').textContent = fmt(exp); $('#sumNet').textContent = fmt(inc - exp);
  $('#monthCard').classList.toggle('hidden', !!query);
  $('#budgetMini').innerHTML = !query && budget() ? `<div class="card">${budgetHtml(mExp)}</div>` : '';

  let html = query ? `<div class="sub">找到 ${list.length} 筆${list.length > 300 ? '（僅顯示前 300 筆）' : ''}</div>` : '', lastDay = '';
  for (const t of shown) {
    if (t.date !== lastDay) { html += `<div class="day">${t.date}</div>`; lastDay = t.date; }
    html += `<div class="tx" data-uid="${esc(t.uid)}"><div class="ic">${emojiOf(c1(t.class1))}</div><div class="grow"><div>${esc(catLabel(t))}</div><div class="sub">${esc(t.memo)}${t.projectId ? ' · ' + esc(projName(t.projectId)) : ''}</div></div><b class="${t.type === 'income' ? 'inc' : 'exp'}">${t.type === 'income' ? '+' : '-'}${fmt(t.amount)}</b></div>`;
  }
  $('#list').innerHTML = html || `<div class="sub">${query ? '找不到符合的紀錄' : '這個月沒有紀錄'}</div>`;

  // 統計
  $('#catTitle').textContent = curMonth + ' 支出分類';
  const byCat = {};
  mlist.filter(t => t.type === 'expense').forEach(t => { const k = emojiOf(c1(t.class1)) + ' ' + (c1(t.class1)?.name || '未分類'); byCat[k] = (byCat[k] || 0) + t.amount; });
  const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const max = entries[0]?.[1] || 1;
  $('#catStats').innerHTML = entries.map(([k, v]) => `<div style="margin-bottom:8px"><div class="row"><span class="grow">${esc(k)}</span><b>${fmt(v)}</b><span class="sub">${Math.round(v / (mExp || 1) * 100)}%</span></div><div class="bar" style="width:${v / max * 100}%"></div></div>`).join('') || '<div class="sub">沒有資料</div>';
  $('#budgetCard').innerHTML = `<h2>${curMonth} 預算</h2>${budgetHtml(mExp)}<p style="margin:8px 0 0"><button class="ghost" id="editBudget">${budget() ? '修改預算' : '設定月預算'}</button></p>`;
  renderTrend();
  renderProjects();
}

async function editBudget() {
  const v = prompt('每月預算（輸入 0 取消預算）', budget() || '');
  if (v === null) return;
  const n = Number(v);
  if (isNaN(n) || n < 0) return alert('請輸入數字');
  try { await api('setSetting', { key: 'monthlyBudget', value: n }); D.settings.monthlyBudget = n; saveCache(); render(); }
  catch (e) { alert('儲存失敗：' + e.message + '\n（若是 unknown action，請依說明更新 Apps Script 並重新部署）'); }
}

/* ---------- 新增 / 編輯（快速輸入） ---------- */
const F = { type: 'expense', c1: '', c2: '' };
function fillSelect(sel, opts, blank) { sel.innerHTML = (blank ? `<option value="">${blank}</option>` : '') + opts.map(o => `<option value="${esc(o.id)}">${esc(o.name)}</option>`).join(''); }

function freqCombos(type) {
  const since = new Date(Date.now() - 120 * 864e5).toISOString().slice(0, 10);
  const cnt = {};
  D.tx.filter(t => t.type === type && t.date >= since && c1(t.class1)).forEach(t => { const k = t.class1 + '|' + t.class2; cnt[k] = (cnt[k] || 0) + 1; });
  return Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k]) => k.split('|'));
}

function renderForm() {
  $('#fTypeExp').classList.toggle('on', F.type === 'expense');
  $('#fTypeInc').classList.toggle('on', F.type === 'income');
  const freq = freqCombos(F.type);
  $('#fFreqLbl').classList.toggle('hidden', !freq.length);
  $('#fFreq').innerHTML = freq.map(([a, b]) => `<button type="button" class="chip" data-a="${esc(a)}" data-b="${esc(b)}">${emojiOf(c1(a))} ${esc((c2(b) || c1(a)).name)}</button>`).join('');
  $('#fGrid').innerHTML = D.cats.filter(c => c.level === 1 && c.kind === F.type)
    .map(c => `<button type="button" class="cat ${c.id === F.c1 ? 'on' : ''}" data-id="${esc(c.id)}"><span>${emojiOf(c)}</span>${esc(c.name)}</button>`).join('');
  const subs = F.c1 ? D.cats.filter(c => c.level === 2 && c.parent === F.c1) : [];
  $('#fSub').innerHTML = subs.length ? `<button type="button" class="chip ${F.c2 === '' ? 'on' : ''}" data-id="">不分</button>` +
    subs.map(c => `<button type="button" class="chip ${c.id === F.c2 ? 'on' : ''}" data-id="${esc(c.id)}">${esc(c.name)}</button>`).join('') : '';
}

function openForm(t) {
  editing = t || null;
  F.type = t?.type || 'expense'; F.c1 = t?.class1 || ''; F.c2 = t?.class2 || '';
  fillSelect($('#fAcc'), D.accounts);
  fillSelect($('#fProj'), D.projects, '（無專案）');
  const lastAcc = t?.accountId || localStorage.getItem('lastAcc') || D.tx.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt))[0]?.accountId;
  if (lastAcc && D.accounts.some(a => a.id === lastAcc)) $('#fAcc').value = lastAcc;
  $('#fProj').value = t?.projectId || '';
  $('#fDate').value = t?.date || ymd(new Date());
  $('#fAmount').value = t?.amount ?? '';
  $('#fMemo').value = t?.memo || '';
  renderForm();
  $('#formDlg').showModal();
  if (!t) setTimeout(() => $('#fAmount').focus(), 50);
}

async function saveForm() {
  const amount = Number($('#fAmount').value);
  if (!amount || amount <= 0) return alert('請輸入金額');
  if (!F.c1) return alert('請選擇分類');
  const now = new Date().toISOString();
  const t = {
    uid: editing?.uid || 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    date: $('#fDate').value, type: F.type, amount,
    accountId: $('#fAcc').value, class1: F.c1, class2: F.c2, projectId: $('#fProj').value,
    memo: $('#fMemo').value, invoiceId: editing?.invoiceId || '', photoFileId: editing?.photoFileId || '',
    createdAt: editing?.createdAt || now, modifiedAt: now
  };
  $('#fSave').disabled = true;
  try {
    await api('upsertTx', { row: txToRow(t) });
    const i = D.tx.findIndex(x => x.uid === t.uid);
    if (i >= 0) D.tx[i] = t; else D.tx.push(t);
    localStorage.setItem('lastAcc', t.accountId);
    curMonth = t.date.slice(0, 7);
    saveCache(); $('#formDlg').close(); render();
  } catch (e) { alert('儲存失敗：' + e.message); }
  $('#fSave').disabled = false;
}

/* ---------- 專案頁 ---------- */
function projectStats() {
  const m = {};
  D.tx.filter(t => t.projectId && t.type === 'expense').forEach(t => {
    const p = m[t.projectId] ||= { id: t.projectId, total: 0, n: 0, days: new Set(), last: '', first: '9999', byCat: {}, tx: [] };
    p.total += t.amount; p.n++; p.days.add(t.date); p.tx.push(t);
    if (t.date > p.last) p.last = t.date; if (t.date < p.first) p.first = t.date;
    const k = emojiOf(c1(t.class1)) + ' ' + (c1(t.class1)?.name || '未分類');
    p.byCat[k] = (p.byCat[k] || 0) + t.amount;
  });
  return Object.values(m).sort((a, b) => b.last.localeCompare(a.last));
}

function renderProjects() {
  const list = projectStats();
  $('#projList').innerHTML = list.map(p => `<div class="card proj" data-id="${esc(p.id)}">
      <div class="row"><span class="grow">${esc(projName(p.id))}</span><b class="exp">${fmt(p.total)}</b></div>
      <div class="sub">${p.first} ~ ${p.last} · ${p.n} 筆 · 記帳 ${p.days.size} 天 · 每記帳日平均 ${fmt(p.total / p.days.size)}</div></div>`).join('')
    || '<div class="card sub">還沒有專案資料</div>';
}

function openProject(id) {
  const p = projectStats().find(x => x.id === id); if (!p) return;
  const cats = Object.entries(p.byCat).sort((a, b) => b[1] - a[1]);
  const max = cats[0]?.[1] || 1;
  $('#projBody').innerHTML = `<h2>${esc(projName(id))}</h2>
    <div class="exp" style="font-size:24px;font-weight:600">${fmt(p.total)}</div>
    <p class="sub">${p.first} ~ ${p.last} · 記帳 ${p.days.size} 天 · 每記帳日平均 ${fmt(p.total / p.days.size)}</p>
    ${cats.map(([k, v]) => `<div style="margin-bottom:8px"><div class="row"><span class="grow">${esc(k)}</span><b>${fmt(v)}</b><span class="sub">${Math.round(v / p.total * 100)}%</span></div><div class="bar" style="width:${v / max * 100}%"></div></div>`).join('')}
    <h2 style="margin-top:14px">明細</h2>
    <table>${p.tx.sort((a, b) => a.date.localeCompare(b.date)).map(t => `<tr><td>${t.date.slice(5)} ${esc(catLabel(t))}<div class="sub">${esc(t.memo)}</div></td><td>${fmt(t.amount)}</td></tr>`).join('')}</table>`;
  $('#projDlg').showModal();
}

/* ---------- 詳情 ---------- */
async function openDetail(uid) {
  const t = D.tx.find(x => x.uid === uid); if (!t) return;
  viewing = t;
  const items = t.invoiceId ? D.items.filter(r => String(r[0]) === t.invoiceId) : [];
  $('#detailBody').innerHTML = `
    <h2>${esc(catLabel(t))}</h2>
    <div class="${t.type === 'income' ? 'inc' : 'exp'}" style="font-size:22px;font-weight:600">${t.type === 'income' ? '+' : '-'}${fmt(t.amount)}</div>
    <p class="sub">${t.date} · ${esc(accName(t.accountId))}${t.projectId ? ' · ' + esc(projName(t.projectId)) : ''}</p>
    <p>${esc(t.memo)}</p>
    ${items.length ? `<h2>電子發票明細（${esc(t.invoiceId)}）</h2><table>${items.map(r => `<tr><td>${esc(r[4])} ×${r[6]}</td><td>${fmt(r[5])}</td></tr>`).join('')}</table>` : ''}
    ${t.photoFileId ? '<p><button class="ghost" id="loadPhoto">載入照片</button></p><div id="photoBox"></div>' : ''}`;
  $('#loadPhoto')?.addEventListener('click', async e => {
    e.target.disabled = true;
    try { const { base64 } = await api('getPhoto', { fileId: t.photoFileId }); $('#photoBox').innerHTML = `<img style="max-width:100%;border-radius:8px" src="data:image/jpeg;base64,${base64}">`; }
    catch (err) { alert(err.message); }
  });
  $('#detailDlg').showModal();
}

/* ---------- 匯入 ---------- */
const decDate = n => { n = +n; return `${1900 + Math.floor(n / 10000)}-${String(Math.floor(n / 100) % 100).padStart(2, '0')}-${String(n % 100).padStart(2, '0')}`; };
const isoTs = s => s > 0 ? new Date(s * 1000).toISOString() : '';
const log = m => { $('#importLog').textContent = m; };

async function parseBackup(file) {
  log('解壓縮中…');
  const zip = await JSZip.loadAsync(file);
  const dbFile = zip.file('db/fin.db');
  if (!dbFile) throw new Error('找不到 db/fin.db，這可能不是 CostDiary 備份檔');
  const SQL = await initSqlJs({ locateFile: f => SQLJS_BASE + f });
  const db = new SQL.Database(await dbFile.async('uint8array'));
  const q = sql => { const r = db.exec(sql); return r.length ? r[0].values : []; };

  const accounts = q('SELECT tid,name,currencytype,money,weeklybudget,monthlybudget,type,color FROM accounts WHERE deleted=0')
    .map(r => [String(r[0]), r[1], r[2], r[3], r[4], r[5], String(r[6]), r[7]]);
  const projects = q('SELECT tid,name,memo,color,priority FROM projects').map(r => [String(r[0]), r[1], r[2], r[3], r[4]]);
  const kindOf = {};
  const cats = q('SELECT tid,type,name,imagename,sorder FROM finclass1').map(r => {
    kindOf[r[0]] = r[1] == 0 ? 'income' : 'expense';
    return [String(r[0]), 1, '', kindOf[r[0]], r[2], r[3], r[4]];
  }).concat(q('SELECT tid,parent,name,imagename,sorder FROM finclass2').map(r => [String(r[0]), 2, String(r[1]), kindOf[r[1]] || 'expense', r[2], r[3], r[4]]));

  const main = q('SELECT uid,sdate,stype,money,class1,class2,account,project,memo,hasphoto,photo,modtime,invoiceid,createtime FROM main WHERE deleted=0');
  const photos = [], invoiceIds = new Set();
  const tx = main.map((r, idx) => {
    const [uid, sdate, stype, money, cl1, cl2, acc, proj, memo, hasPhoto, photo, modtime, inv, createtime] = r;
    if (inv) invoiceIds.add(inv);
    if (hasPhoto == 1 && photo) photos.push({ idx, path: `acc/${acc}/images/${photo}.jpg`, name: `${photo}.jpg` });
    const date = decDate(sdate);
    return [uid, date, stype == 0 ? 'income' : 'expense', Math.abs(money), String(acc), String(cl1), String(cl2),
            proj ? String(proj) : '', memo || '', inv || '', '', createtime > 0 ? isoTs(createtime) : date + 'T12:00:00.000Z', isoTs(modtime)];
  });

  const items = []; let missing = 0;
  for (const id of invoiceIds) {
    const f = zip.file(`invoice/receipt/${id}.raw`);
    if (!f) { missing++; continue; }
    try {
      const j = JSON.parse(await f.async('string'));
      (j.shopping_list || []).forEach(it => items.push([id, j.seller_id || '', decDate(j.date), j.amount, it.name, it.price, it.count]));
    } catch { missing++; }
  }
  return { zip, accounts, projects, cats, tx, items, photos, missing, invoiceCount: invoiceIds.size };
}

$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  $('#upload').disabled = true;
  try {
    parsed = await parseBackup(f);
    const dates = parsed.tx.map(r => r[1]).sort();
    log(`解析完成\n交易：${parsed.tx.length} 筆（${dates[0]} ~ ${dates.at(-1)}）\n帳戶：${parsed.accounts.length}　專案：${parsed.projects.length}　分類：${parsed.cats.length}\n電子發票：${parsed.invoiceCount} 張（找不到明細檔 ${parsed.missing} 張）→ 品項 ${parsed.items.length} 列\n照片：${parsed.photos.length} 張`);
    $('#upload').disabled = false;
  } catch (err) { log('解析失敗：' + err.message); }
});

async function pushRows(sheet, rows, label) {
  for (let i = 0; i < rows.length; i += 500) {
    log(`${label}… ${Math.min(i + 500, rows.length)}/${rows.length}`);
    await api('append', { sheet, rows: rows.slice(i, i + 500) });
  }
}

$('#upload').addEventListener('click', async () => {
  if (!parsed) return;
  $('#upload').disabled = true;
  try {
    await api('ping');
    if ($('#wipe').checked) for (const s of ['Transactions', 'Accounts', 'Projects', 'Categories', 'ReceiptItems']) await api('clear', { sheet: s });
    for (const p of parsed.photos) {
      log(`上傳照片 ${p.name}…`);
      const f = parsed.zip.file(p.path);
      if (f) parsed.tx[p.idx][10] = (await api('uploadPhoto', { name: p.name, base64: await f.async('base64') })).fileId;
    }
    await pushRows('Accounts', parsed.accounts, '帳戶');
    await pushRows('Projects', parsed.projects, '專案');
    await pushRows('Categories', parsed.cats, '分類');
    await pushRows('ReceiptItems', parsed.items, '發票明細');
    await pushRows('Transactions', parsed.tx, '交易');
    log('匯入完成，重新載入資料…');
    await loadAll();
    log('✅ 匯入完成！到「明細」查看。');
  } catch (err) { log('上傳失敗：' + err.message + '\n（可修正後再按一次，勾選「先清空」可避免重複）'); }
  $('#upload').disabled = false;
});

/* ---------- 事件 / 啟動 ---------- */
function showTab(name) {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.tab === name));
  document.querySelectorAll('main > section').forEach(sec => sec.classList.toggle('hidden', sec.id !== 'tab-' + name));
  $('#fab').classList.toggle('hidden', name !== 'list');
  window.scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
let qTimer;
$('#q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { query = e.target.value.trim(); render(); }, 150); });
$('#budgetCard').addEventListener('click', e => { if (e.target.id === 'editBudget') editBudget(); });
$('#trend').addEventListener('click', e => { const g = e.target.closest('[data-month]'); if (g) { curMonth = g.dataset.month; $('#q').value = ''; query = ''; render(); showTab('list'); } });
const shiftMonth = d => { const [y, m] = curMonth.split('-').map(Number); const dt = new Date(y, m - 1 + d, 1); curMonth = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`; render(); };
$('#prev').onclick = () => shiftMonth(-1); $('#next').onclick = () => shiftMonth(1);
$('#month').onchange = e => { if (e.target.value) { curMonth = e.target.value; render(); } };
$('#list').addEventListener('click', e => { const el = e.target.closest('.tx'); if (el) openDetail(el.dataset.uid); });
$('#fab').onclick = () => openForm();
$('#fTypeExp').onclick = () => { F.type = 'expense'; F.c1 = F.c2 = ''; renderForm(); };
$('#fTypeInc').onclick = () => { F.type = 'income'; F.c1 = F.c2 = ''; renderForm(); };
$('#fFreq').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { F.c1 = b.dataset.a; F.c2 = b.dataset.b; renderForm(); } });
$('#fGrid').addEventListener('click', e => { const b = e.target.closest('.cat'); if (b) { F.c1 = b.dataset.id; F.c2 = ''; renderForm(); } });
$('#fSub').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { F.c2 = b.dataset.id; renderForm(); } });
$('#projList').addEventListener('click', e => { const el = e.target.closest('.proj'); if (el) openProject(el.dataset.id); });
$('#pClose').onclick = () => $('#projDlg').close();
$('#fCancel').onclick = () => $('#formDlg').close(); $('#fSave').onclick = saveForm;
$('#dClose').onclick = () => $('#detailDlg').close();
$('#dEdit').onclick = () => { $('#detailDlg').close(); openForm(viewing); };
$('#dDelete').onclick = async () => {
  if (!confirm('確定刪除這筆紀錄？')) return;
  try { await api('deleteTx', { uid: viewing.uid }); D.tx = D.tx.filter(t => t.uid !== viewing.uid); saveCache(); $('#detailDlg').close(); render(); }
  catch (e) { alert(e.message); }
};
$('#saveCfg').onclick = async () => {
  cfg.url = $('#cfgUrl').value.trim(); cfg.token = $('#cfgToken').value;
  localStorage.setItem('apiUrl', cfg.url); localStorage.setItem('apiToken', cfg.token);
  $('#cfgMsg').textContent = '連線中…';
  try { await loadAll(); $('#cfgMsg').textContent = `✅ 已連線，載入 ${D.tx.length} 筆交易`; }
  catch (e) { $('#cfgMsg').textContent = '❌ ' + e.message; }
};

$('#cfgUrl').value = cfg.url; $('#cfgToken').value = cfg.token;
(async () => {
  const c = await cacheGet('data');
  if (c?.D) { D = c.D; D.settings ||= {}; render(); setStatus('顯示上次資料（' + hhmm(c.at) + '），同步中…'); }
  else render();
  if (cfg.url) loadAll().catch(e => { $('#cfgMsg').textContent = '❌ ' + e.message; });
})();
</script>
