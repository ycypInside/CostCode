  const parts = monthKey.split("-").map(Number);
  const dim = new Date(parts[0], parts[1], 0).getDate();
  let picked = Math.min(Math.max(day, 1), dim);
  if (localISODate(today).slice(0, 7) === monthKey) picked = Math.min(picked, today.getDate());
  return monthKey + "-" + String(picked).padStart(2, "0");
}

function taipeiFromUnix(sec) {
  const n = Number(sec);
  if (!n) return "";
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "Asia/Taipei",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23",
  }).formatToParts(new Date(n * 1000));
  const grab = (type) => parts.find((part) => part.type === type).value;
  return grab("year") + "-" + grab("month") + "-" + grab("day") + " " + grab("hour") + ":" + grab("minute") + ":" + grab("second");
}

function formatMoney(n) {
  const value = Number(n) || 0;
  const negative = value < 0;
  const abs = Math.abs(value);
  const hasFrac = Math.abs(abs - Math.round(abs)) > 0.001;
  const text = abs.toLocaleString("zh-TW", {
    minimumFractionDigits: hasFrac ? 2 : 0,
    maximumFractionDigits: 2,
  });
  return negative ? "-" + text : text;
}

function weekday(date) {

function formatDayLabel(date) {

}

function shiftISO(iso, delta) {
  const parsed = parseISODate(iso);
  if (!parsed) return iso || "";
  return localISODate(addDays(parsed, delta));
}

function weekDates(iso) {
  const parsed = parseISODate(iso) || new Date();
  const index = parsed.getDay();
  const monday = addDays(parsed, index === 0 ? -6 : 1 - index);
  const days = [];
  for (let i = 0; i < 7; i++) days.push(localISODate(addDays(monday, i)));
  return days;
}

function monthTitle(ym) {

function isAllowedApiUrl(url) {
  const match = /^([a-z][a-z0-9+.-]*):\/\/([^/?#]*)/i.exec(String(url || "").trim());
  if (!match) return false;
  const protocol = match[1].toLowerCase();
  let host = match[2].split("@").pop();
  if (host.charAt(0) === "[") {
    const end = host.indexOf("]");
    host = end > 0 ? host.slice(1, end) : "";
  } else host = host.replace(/:\d+$/, "");
  host = host.toLowerCase();
  if (!host) return false;
  if (protocol === "https") return true;
  return protocol === "http" && (host === "localhost" || host === "127.0.0.1" || host === "::1");
}

function mapReceipt(invoiceId, text) {
  const clean = String(text || "").replace(/^\uFEFF/, "").trim();
  if (!clean) return [];
  let root;
  try {
    root = JSON.parse(clean);
  } catch (error) {
    const invalid = new Error("發票檔不是 JSON");
    invalid.code = "invalid-json";
    throw invalid;
  }
  if (!root || typeof root !== "object") return [];
  const body = root.data && typeof root.data === "object" ? root.data : root;
  const sellerId = String(body.sellerBan || body.sellerId || body.ban || "");
  const total = round2(body.amount != null ? body.amount : (body.total != null ? body.total : body.totalAmount));
  let date = "";
  [body.date, body.invDate, body.invoiceDate].some((value) => {
    if (value == null || value === "") return false;
    const digits = String(value).trim();
    if (/^\d{6,8}$/.test(digits)) date = decodeSdate(digits);
    if (!date) date = normalizeLooseDate(value);
    return !!date;
  });
  const list = body.shopping_list || body.shoppingList || body.details || body.items || [];
  if (!Array.isArray(list)) return [];
  return list.filter((item) => item && typeof item === "object").map((item) => ({
    invoiceId: String(invoiceId),
    sellerId: sellerId,
    date: date,
    total: total,
    itemName: String(item.itemName || item.name || item.description || item.title || item.item || "品項"),
    price: round2(item.price != null ? item.price : (item.unitPrice != null ? item.unitPrice : item.amount)),
    count: round2(item.count != null ? item.count : (item.quantity != null ? item.quantity : item.qty)) || 1,
  }));
}

function normalizeData(raw) {
  const data = emptyData();

  data.categories = list(source.categories).map((cat) => ({

  data.receiptItems = list(source.receiptItems).map((item) => ({

  })).filter((item) => item.invoiceId);
  const settings = source.settings && typeof source.settings === "object" && !Array.isArray(source.settings) ? source.settings : {};
  Object.keys(settings).forEach((key) => {
    data.settings[key] = settings[key] == null ? "" : String(settings[key]);
  });
  return data;

function applyOp(data, op) {
  if (!op) return data;
  if (op.op === "upsertTx" && op.row) {
    const row = publicTx(op.row);
    const index = data.transactions.findIndex((tx) => tx.uid === row.uid);
    if (index >= 0) data.transactions[index] = row;
    else data.transactions.push(row);
  } else if (op.op === "deleteTx") {
    data.transactions = data.transactions.filter((tx) => tx.uid !== String(op.uid));
  } else if (op.op === "upsertProject" && op.project) {
    const project = publicProject(op.project);
    if (project.id && project.id !== "0" && project.name) {
      const index = data.projects.findIndex((item) => item.id === project.id);
      if (index >= 0) data.projects[index] = project;
      else data.projects.push(project);
    }
  } else if (op.op === "setSetting" && op.key) {
    data.settings = Object.assign({}, data.settings, { [op.key]: op.value == null ? "" : String(op.value) });
  }
  return data;
}

function searchTransactions(data, query) {
  const terms = String(query || "").trim().toLowerCase().split(/\s+/).filter(Boolean).map((term) => term.replace(/,/g, ""));
  if (!terms.length) return (data.transactions || []).slice();
  const items = new Map();
  (data.receiptItems || []).forEach((item) => {
    const id = String(item.invoiceId || "");
    if (!id) return;
    const list = items.get(id) || [];
    list.push(String(item.itemName || ""));
    items.set(id, list);
  });
  return data.transactions.filter((tx) => {
    const hay = [
      tx.memo, tx.amount, tx.date, tx.invoiceId,
      (categoryByLevel(data, tx.class1, "1") || {}).name,
      (categoryByLevel(data, tx.class2, "2") || {}).name,
      (findById(data.projects, tx.projectId) || {}).name,
      (findById(data.accounts, tx.accountId) || {}).name,
      (items.get(String(tx.invoiceId || "")) || []).join(" "),
    ].join("\n").toLowerCase().replace(/,/g, "");
    return terms.every((term) => hay.includes(term));
  });
}

function budgetStatus(spent, budget, today) {
  const year = today.getFullYear();
  const month = today.getMonth() + 1;
  const dim = new Date(year, month, 0).getDate();
  const daysLeft = dim - today.getDate() + 1;
  const saved = Number(budget) || 0;
  const used = Number(spent) || 0;
  const remaining = saved - used;
  return {
    year: year, month: month, dim: dim, day: today.getDate(), daysLeft: daysLeft,
    spent: used, budget: saved, remaining: remaining,
    perDay: daysLeft > 0 ? remaining / daysLeft : remaining,
    ratio: saved > 0 ? used / saved : 0,
    over: saved > 0 && used > saved,
  };
}

function sumMonth(txs, key, type) {

    if (tx.type !== type || !tx.date || String(tx.date).slice(0, 7) !== key) return;
    total += Number(tx.amount) || 0;

  return round2(total);
}

function frequentPairs(data, kind, today, days) {
  const from = localISODate(addDays(today, -(days == null ? 120 : days)));
  const counts = new Map();
  (data.transactions || []).forEach((tx) => {
    if (tx.type !== kind || !tx.date || tx.date < from) return;
    const key = String(tx.class1 || "") + "|" + String(tx.class2 || "");
    counts.set(key, (counts.get(key) || 0) + 1);
  });
  return [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 6);
}

function projectStats(data, projectId) {
  const txs = (data.transactions || []).filter((tx) => String(tx.projectId) === String(projectId));
  const total = round2(txs.filter((tx) => tx.type === "expense").reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0));
  const dates = [...new Set(txs.map((tx) => tx.date).filter(Boolean))].sort();
  const start = dates[0] || "";
  const end = dates[dates.length - 1] || "";
  let calendarDays = 0;
  if (start && end) calendarDays = Math.round((parseISODate(end) - parseISODate(start)) / 86400000) + 1;
  const bookedDays = dates.length;
  return { txs: txs, total: total, count: txs.length, start: start, end: end, calendarDays: calendarDays, bookedDays: bookedDays, avg: bookedDays ? total / bookedDays : 0 };
}

function categoryBreakdown(data, txs, kind) {
  const map = new Map();

function renderChart(keys) {
  const width = 360;
  const height = 176;
  const kind = state.statsKind === "income" ? "income" : "expense";
  const values = keys.map((key) => sumMonth(state.data.transactions, key, kind));
  const max = Math.max.apply(null, [1].concat(values));
  const slot = width / keys.length;
  const current = localISODate(new Date()).slice(0, 7);
  const color = kind === "income" ? "#0c7a58" : "#c84b2f";
  const kindLabel = kind === "income" ? "收入" : "支出";
  const svg = svgEl("svg", { viewBox: "0 0 " + width + " " + height, class: "chart", role: "group", "aria-label": "近 12 個月" + kindLabel });
  keys.forEach((key, index) => {
    const x = index * slot;
    if (key === current) svg.append(svgEl("rect", { x: x + 1, y: 8, width: Math.max(slot - 2, 1), height: 124, rx: 6, fill: "#e7eeff" }));
    const barH = values[index] ? Math.max(2, Math.round(values[index] / max * 112)) : 0;
    const base = 132;
    if (barH) svg.append(svgEl("rect", { x: x + slot * 0.28, y: base - barH, width: slot * 0.44, height: barH, rx: 2, fill: color }));
    svg.append(svgEl("text", { x: x + slot / 2, y: 156, "text-anchor": "middle", fill: key === current ? "#1e4fd7" : "#6f675f", "font-size": "11" }, String(Number(key.slice(5)))));
    const hit = svgEl("rect", { x: x, y: 0, width: slot, height: height, fill: "transparent", role: "button", tabindex: "0", "aria-label": monthTitle(key) + " " + kindLabel + " " + formatMoney(values[index]) + " 元" });
    const open = () => {
      const today = localISODate(new Date());
      focusDay(key === today.slice(0, 7) ? today : key + "-01");
      state.tab = "ledger";
      state.query = "";
      state.ledgerKind = kind;
      state.overlay = null;
      render();
    };
    hit.addEventListener("click", open);
    hit.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); open(); }
    });
    svg.append(hit);
  });
  return svg;
}

function openDb() {
  if (!dbPromise) {
    dbPromise = new Promise((resolve, reject) => {
      const request = indexedDB.open("daily-ledger", 1);
      request.onupgradeneeded = () => {
        if (!request.result.objectStoreNames.contains("kv")) request.result.createObjectStore("kv");
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }
  return dbPromise;
}

function kvGet(key) {
  return openDb().then((db) => new Promise((resolve, reject) => {
    const request = db.transaction("kv", "readonly").objectStore("kv").get(key);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  }));
}

function kvSet(key, value) {
  return openDb().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}

async function saveSnapshot() { await kvSet("snapshot", state.data); }

async function enqueue(op) {
  const queue = (await kvGet("queue")) || [];
  queue.push(op);
  await kvSet("queue", queue);
  state.pending = queue.length;
}

async function commit(op) {
  if (state.mode === "pfpro" && op.op === "upsertTx") {
    if (pfEntryUsesSplit(op.row)) {
      const plan = previewPfSplit(op.row);
      if (!plan.ok) throw new Error(plan.error);
      if (plan.wholeAdvance) {
        if (state.data.transactions.some((tx) => tx.uid === op.row.uid)) applyOp(state.data, { op: "deleteTx", uid: op.row.uid });
      } else {
        op.row.amount = plan.localAmount;
        op.row.type = plan.localType === "income" ? "income" : "expense";
        applyOp(state.data, op);
      }
      await enqueuePfLegs(op.row, plan);
      await saveSnapshot();
      if (!navigator.onLine) return { queued: true, plan: plan };
      await flushPfQueue();
      return { queued: state.pending > 0, plan: plan };
    }
    const preview = previewPfTx(op.row, !!(state.form && state.form.reimburse));
    if (!preview.ok) throw new Error(preview.error);
    applyOp(state.data, op);
    await enqueuePfTx(op.row, !!(state.form && state.form.reimburse));
    await saveSnapshot();
    if (!navigator.onLine) return { queued: true };
    await flushPfQueue();
    return { queued: state.pending > 0 };
  }
  if (state.mode === "pfpro" && op.op === "deleteTx") {
    applyOp(state.data, op);
    await enqueuePfDelete(String(op.uid));
    await saveSnapshot();
    if (!navigator.onLine) return { queued: true };
    await flushPfQueue();
    return { queued: state.pending > 0 };
  }
  applyOp(state.data, op);
  if (state.mode !== "cloud") {
    await saveSnapshot();
    return { queued: false };
  }
  await enqueue(op);
  await saveSnapshot();
  if (!navigator.onLine) return { queued: true };
  await flushQueue();
  return { queued: state.pending > 0 };
}

async function flushQueue() {
  const queue = (await kvGet("queue")) || [];
  if (!queue.length) { state.pending = 0; return; }
  if (!navigator.onLine) return;
  const remain = [];
  for (let i = 0; i < queue.length; i++) {
    try {
      await sendOp(queue[i]);
    } catch (error) {
      remain.push(queue[i]);
      for (let j = i + 1; j < queue.length; j++) remain.push(queue[j]);
      state.loadError = "有變更還沒上傳：" + messageOf(error);
      break;
    }
  }
  await kvSet("queue", remain);
  state.pending = remain.length;
  if (!remain.length) state.loadError = "";
}

async function sendOp(op) {
  if (op.op === "upsertTx") {
    const row = Object.assign({}, op.row);
    if (String(row.photoFileId || "").indexOf("pending:") === 0) {
      const photo = await kvGet("photo:" + row.photoFileId);
      if (photo) {
        const uploaded = await api("uploadPhoto", { name: photo.name || "photo.jpg", mime: photo.mime, base64: photo.base64 }, 60000);
        row.photoFileId = uploaded.fileId;
        op.row.photoFileId = uploaded.fileId;
      }
    }
    await api("upsertTx", { row: row }, 30000);
  } else if (op.op === "deleteTx") {
    await api("deleteTx", { uid: op.uid }, 30000);
  } else if (op.op === "setSetting") {
    await api("setSetting", { key: op.key, value: op.value }, 30000);
  } else if (op.op === "upsertProject") {
    await api("append", { sheet: "Projects", rows: [projectToRow(op.project)] }, 30000);
  }
}

async function api(action, extra, timeoutMs, creds) {
  const url = ((creds && creds.url) || localStorage.getItem("apiUrl") || "").trim();
  const token = (creds && creds.token) || localStorage.getItem("apiToken") || "";
  if (!url || !token) throw new Error("尚未設定連線");
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || 30000);
  try {
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(Object.assign({ token: token, action: action }, extra || {})),
      signal: controller.signal,
    });
    const text = await response.text();
    let data;
    try { data = JSON.parse(text); }
    catch (error) { throw new Error("回傳的不是 JSON。請確認網址是網頁應用程式的 /exec，而且存取權是「所有人」。"); }
    if (data.version) state.backendVersion = data.version;
    if (!data.ok) throw new Error(data.error || "後端拒絕");
    return data;
  } catch (error) {
    if (error.name === "AbortError") throw new Error("連線逾時，請再試一次");
    if (error.name === "TypeError") throw new Error("連不上後端");
    throw error;
  } finally {
    clearTimeout(timer);
  }
}

function pfActive() {
  return state.mode === "pfpro";
}

function pfCreds(override) {
  if (override && override.url) return { url: String(override.url).trim(), token: override.token || "" };
  return {
    url: (localStorage.getItem("pfApiUrl") || "").trim(),
    token: localStorage.getItem("pfApiToken") || "",
  };
}

function loadPfAccountCache() {
  try {
    const parsed = JSON.parse(localStorage.getItem("pfAccounts") || "[]");
    return Array.isArray(parsed) && window.PfPro ? PfPro.normalizeAccounts(parsed) : [];
  } catch (error) {
    return [];
  }
}

function loadPfMeta() {
  try {
    const parsed = JSON.parse(localStorage.getItem("pfMeta") || "{}");
    return parsed && typeof parsed === "object" ? parsed : {};
  } catch (error) {
    return {};
  }
}

function savePfMeta(meta) {
  localStorage.setItem("pfMeta", JSON.stringify(meta || {}));
}

function rememberPfTxn(uid, txnId, requestId, reimburse) {
  const meta = loadPfMeta();
  const prev = meta[uid] || {};
  const next = {
    txnId: txnId || prev.txnId || "",
    requestId: requestId || prev.requestId || "",
    rev: Math.max(prev.rev || 0, PfPro.revOf(requestId)),
    reimburse: reimburse == null ? !!prev.reimburse : !!reimburse,
  };
  if (prev.friendName) next.friendName = prev.friendName;
  if (prev.advance) next.advance = prev.advance;
  if (prev.adv) next.adv = prev.adv;
  meta[uid] = next;
  savePfMeta(meta);
}

function rememberAdvTxn(uid, txnId, requestId) {
  const meta = loadPfMeta();
  const prev = meta[uid] || {};
  const prior = prev.adv || {};
  prev.adv = {
    txnId: txnId || prior.txnId || "",
    requestId: requestId || prior.requestId || "",
    rev: Math.max(prior.rev || 0, PfPro.revOf(requestId)),
  };
  meta[uid] = prev;
  savePfMeta(meta);
}

function clearExpenseMeta(uid) {
  const meta = loadPfMeta();
  const prev = meta[uid];
  if (!prev) return;
  prev.txnId = "";
  prev.requestId = "";
  prev.rev = 0;
  prev.reimburse = false;
  if (!prev.adv) delete meta[uid];
  else meta[uid] = prev;
  savePfMeta(meta);
}

function clearAdvMeta(uid) {
  const meta = loadPfMeta();
  const prev = meta[uid];
  if (!prev) return;
  delete prev.adv;
  delete prev.friendName;
  delete prev.advance;
  if (!prev.txnId && !prev.requestId) delete meta[uid];
  else meta[uid] = prev;
  savePfMeta(meta);
}

function forgetPfTxn(uid) {
  const meta = loadPfMeta();
  delete meta[uid];
  savePfMeta(meta);
}

function expenseVoidId(uid, requestId) {
  return String(requestId || "").indexOf("-exp") >= 0 ? ("cc-" + uid + "-exp-void") : ("cc-" + uid + "-void");
}

function advVoidId(uid, advMeta) {
  const rev = advMeta && advMeta.rev ? advMeta.rev : 0;
  return "cc-" + uid + "-adv-void" + (rev ? ("-r" + rev) : "");
}

function loadPayLog() {
  try {
    const parsed = JSON.parse(localStorage.getItem("pfPayLog") || "[]");
    return Array.isArray(parsed) ? parsed : [];
  } catch (error) {
    return [];
  }
}

function savePayLog(rows) {
  localStorage.setItem("pfPayLog", JSON.stringify((rows || []).slice(0, 12)));
}

let pfLock = Promise.resolve();
function withPfLock(fn) {
  const prev = pfLock;
  let release;
  const gate = new Promise((resolve) => { release = resolve; });
  pfLock = prev.then(() => gate);
  return prev.then(() => fn()).finally(() => release());
}

function previewPfTx(row, reimburse) {
  const main = categoryByLevel(state.data, row.class1, "1");
  const sub = categoryByLevel(state.data, row.class2, "2");
  const account = (state.pfAccounts || []).find((item) => item.id === String(row.accountId));
  return PfPro.planTx({
    uid: row.uid,
    date: row.date,
    type: row.type,
    amount: row.amount,
    accountId: row.accountId,
    currency: account && account.currency ? account.currency : "TWD",
    mainName: main && main.name,
    subName: sub && sub.name,
    memo: row.memo,
    reimburse: !!reimburse,
  });
}

function previewPfSplit(row) {
  const form = state.form || {};
  const main = categoryByLevel(state.data, row.class1, "1");
  const sub = categoryByLevel(state.data, row.class2, "2");
  const account = (state.pfAccounts || []).find((item) => item.id === String(row.accountId));
  const mode = form.type === "advance" ? "advance" : (row.type === "income" ? "income" : "expense");
  return PfPro.planSplit({
    uid: row.uid,
    date: row.date,
    type: mode === "income" ? "income" : "expense",
    mode: mode,
    amount: round2(row.amount),
    advance: mode === "advance" ? round2(row.amount) : parseAmount(form.advanceStr),
    accountId: row.accountId,
    currency: account && account.currency ? account.currency : "TWD",
    accountType: account && account.type,
    mainName: main && main.name,
    subName: sub && sub.name,
    memo: row.memo,
    reimburse: !!form.reimburse,
    friendName: form.friendName || "",
  });
}

function pfEntryUsesSplit(row) {
  const form = state.form || {};
  if (form.type === "advance") return true;
  if (parseAmount(form.advanceStr) > 0) return true;
  const meta = row && row.uid ? (loadPfMeta()[row.uid] || {}) : {};
  return !!(meta.adv || Number(meta.advance) > 0);
}

async function readPfQueue() {
  return (await kvGet("pfQueue")) || [];
}

async function enqueuePfTx(row, reimburse) {
  const plan = previewPfTx(row, reimburse);
  if (!plan.ok) throw new Error(plan.error);
  const meta = loadPfMeta()[row.uid] || {};
  const rev = (meta.rev || 0) + 1;
  const requestId = meta.txnId ? ("cc-" + row.uid + "-r" + rev) : plan.requestId;
  await withPfLock(async () => {
    const queue = await readPfQueue();
    const next = PfPro.queueWrite(queue, {
      uid: row.uid,
      requestId: requestId,
      data: plan.data,
      replace: !!meta.txnId,
      txnId: meta.txnId || "",
      local: { op: "upsertTx", row: row },
    });
    const op = next.filter((item) => item.uid === row.uid).pop();
    rememberPfTxn(row.uid, meta.txnId || "", op.requestId, !!reimburse);
    await kvSet("pfQueue", next);
    state.pending = next.length;
  });
}

async function enqueuePfLegs(row, plan) {
  await withPfLock(async () => {
    let queue = await readPfQueue();
    const meta = loadPfMeta()[row.uid] || {};
    const wantAdv = plan.legs.some((leg) => leg.leg === "adv");
    const wantExp = plan.legs.some((leg) => leg.action === "add_transaction");
    if (!wantAdv) {
      queue = PfPro.queueVoidLeg(queue, {
        uid: row.uid,
        leg: "adv",
        txnId: (meta.adv && meta.adv.txnId) || "",
        voidRequestId: advVoidId(row.uid, meta.adv),
        dropUnsent: true,
        local: null,
      });
    }
    if (!wantExp) {
      queue = PfPro.queueVoidLeg(queue, {
        uid: row.uid,
        leg: "exp",
        txnId: meta.txnId || "",
        voidRequestId: expenseVoidId(row.uid, meta.requestId),
        dropUnsent: true,
        local: { op: "deleteTx", uid: row.uid },
      });
    }
    plan.legs.forEach((leg) => {
      if (leg.leg === "adv") {
        const advMeta = meta.adv || {};
        if (advMeta.txnId) {
          const rev = (advMeta.rev || 0) + 1;
          queue = PfPro.queueTransferEdit(queue, {
            uid: row.uid,
            leg: "adv",
            txnId: advMeta.txnId,
            voidRequestId: advVoidId(row.uid, advMeta),
            requestId: "cc-" + row.uid + "-adv-r" + rev,
            data: leg.data,
            local: plan.wholeAdvance ? { op: "deleteTx", uid: row.uid } : null,
          });
        } else {
          queue = PfPro.queueLeg(queue, {
            uid: row.uid,
            leg: "adv",
            action: "add_transfer",
            requestId: leg.requestId,
            data: leg.data,
            local: plan.wholeAdvance ? { op: "deleteTx", uid: row.uid } : null,
          });
        }
        return;
      }
      const txnId = meta.txnId || "";
      const rev = (meta.rev || 0) + 1;
      queue = PfPro.queueLeg(queue, {
        uid: row.uid,
        leg: "exp",
        action: "add_transaction",
        requestId: txnId ? (leg.requestId + "-r" + rev) : leg.requestId,
        data: leg.data,
        replace: !!txnId,
        txnId: txnId,
        local: { op: "upsertTx", row: row },
      });
    });
    const expOp = queue.filter((op) => op && op.uid === row.uid && (op.action === "add_transaction" || op.action === "replace_transaction")).pop();
    const advOp = queue.filter((op) => op && op.uid === row.uid && op.leg === "adv" && op.action === "add_transfer").pop();
    const all = loadPfMeta();
    const prev = all[row.uid] || {};
    const stored = {
      txnId: prev.txnId || meta.txnId || "",
      requestId: expOp ? expOp.requestId : (wantExp ? (prev.requestId || "") : ""),
      rev: expOp ? Math.max(prev.rev || 0, PfPro.revOf(expOp.requestId)) : (wantExp ? (prev.rev || 0) : 0),
      reimburse: !!(state.form && state.form.reimburse && plan.legs.some((leg) => leg.category === "工作")),
    };
    if (plan.advance > 0) {
      stored.friendName = plan.friendName;
      stored.advance = plan.advance;
    }
    if (wantAdv) {
      stored.adv = {
        txnId: (meta.adv && meta.adv.txnId) || "",
        requestId: advOp ? advOp.requestId : ((meta.adv && meta.adv.requestId) || ""),
        rev: advOp ? Math.max((meta.adv && meta.adv.rev) || 0, PfPro.revOf(advOp.requestId)) : ((meta.adv && meta.adv.rev) || 0),
      };
    } else if (meta.adv && meta.adv.txnId) stored.adv = meta.adv;
    all[row.uid] = stored;
    savePfMeta(all);
    await kvSet("pfQueue", queue);
    state.pending = queue.length;
    if (wantAdv && stored.adv) {
      pushPayLog({
        kind: "advance",
        requestId: stored.adv.requestId,
        date: row.date,
        amount: plan.advance,
        fromName: displayAccountName(row.accountId),
        toName: PfPro.AR_FRIENDS_NAME,
        friendName: plan.friendName,
      });
    }
  });
}

async function enqueuePfDelete(uid) {
  const meta = loadPfMeta()[uid] || {};
  await withPfLock(async () => {
    let queue = await readPfQueue();
    const split = !!(meta.adv || Number(meta.advance) > 0 || queue.some((op) => op && op.uid === uid && op.leg === "adv"));
    if (split) {
      queue = PfPro.queueVoidLeg(queue, {
        uid: uid,
        leg: "exp",
        txnId: meta.txnId || "",
        voidRequestId: expenseVoidId(uid, meta.requestId),
        dropUnsent: false,
        local: { op: "deleteTx", uid: uid },
      });
      queue = PfPro.queueVoidLeg(queue, {
        uid: uid,
        leg: "adv",
        txnId: (meta.adv && meta.adv.txnId) || "",
        voidRequestId: advVoidId(uid, meta.adv),
        dropUnsent: false,
        local: null,
      });
    } else queue = PfPro.queueVoid(queue, { uid: uid, txnId: meta.txnId || "" });
    await kvSet("pfQueue", queue);
    state.pending = queue.length;
  });
}

async function enqueuePfTransfer(plan, note) {
  const uid = String(plan.requestId || "").replace(/^cc-/, "");
  await withPfLock(async () => {
    const queue = await readPfQueue();
    const next = PfPro.queueTransfer(queue, {
      uid: uid,
      requestId: plan.requestId,
      data: plan.data,
    });
    await kvSet("pfQueue", next);
    state.pending = next.length;
    pushPayLog({
      kind: note.kind || "card",
      requestId: plan.requestId,
      date: note.date,
      amount: note.amount,
      fromName: note.fromName,
      toName: note.toName,
      friendName: note.friendName || "",
    });
  });
}

function pushPayLog(entry) {
  const log = loadPayLog().filter((row) => row.requestId !== entry.requestId);
  log.unshift({
    kind: entry.kind || "card",
    requestId: entry.requestId,
    state: "queued",
    date: entry.date || "",
    amount: entry.amount,
    fromName: entry.fromName || "",
    toName: entry.toName || "",
    friendName: entry.friendName || "",
  });
  savePayLog(log);
}

async function enqueuePfRepay(plan, note) {
  await withPfLock(async () => {
    const queue = await readPfQueue();
    const next = PfPro.queueLeg(queue, {
      uid: plan.uid,
      leg: "repay",
      action: "add_transfer",
      requestId: plan.requestId,
      data: plan.data,
      local: null,
    });
    await kvSet("pfQueue", next);
    state.pending = next.length;
    pushPayLog({
      kind: "repay",
      requestId: plan.requestId,
      date: note.date,
      amount: note.amount,
      fromName: PfPro.AR_FRIENDS_NAME,
      toName: note.toName,
      friendName: note.friendName,
    });
  });
}

async function pfGet(q, creds) {
  const auth = pfCreds(creds);
  const problem = PfPro.endpointError(auth.url, auth.token);
  if (problem) throw new Error(problem);
  const url = new URL(auth.url);
  url.searchParams.set("q", q);
  url.searchParams.set("token", auth.token);
  let response;
  try {
    response = await fetch(url.toString(), {
      method: "GET",
      redirect: "follow",
      referrerPolicy: "no-referrer",
      cache: "no-store",
      credentials: "omit",
    });
  } catch (error) {
    throw new Error("連不上 PF Pro");
  }
  const text = await response.text();
  let data;
  try { data = JSON.parse(text); }
  catch (error) { throw new Error("PF Pro 回傳的不是 JSON"); }
  if (!data.ok) throw new Error(PfPro.explainError(data.error, data.reason));
  return data;
}

async function pfPostOnce(endpoint, body) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 30000);
  try {
    const response = await fetch(endpoint, {
      method: "POST",
      redirect: "follow",
      referrerPolicy: "no-referrer",
      cache: "no-store",
      credentials: "omit",
      headers: { "Content-Type": "text/plain" },
      body: body,
      signal: controller.signal,
    });
    const text = await response.text();
    try { return JSON.parse(text); }
    catch (error) { return { ok: false, error: "bad json", reason: "parse_error" }; }
  } catch (error) {
    if (error.name === "AbortError") return { ok: false, error: "連線逾時，請再試一次" };
    return { ok: false, error: "server" };
  } finally {
    clearTimeout(timer);
  }
}

async function pfPost(action, data, requestId, creds) {
  const auth = pfCreds(creds);
  const problem = PfPro.endpointError(auth.url, auth.token);
  if (problem) throw new Error(problem);
  const endpoint = PfPro.withPostQuery(auth.url, auth.token);
  const body = JSON.stringify({
    token: auth.token,
    request_id: requestId,
    action: action,
    client: "costcode",
    data: data,
  });
  let last = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (attempt) await new Promise((resolve) => setTimeout(resolve, attempt === 1 ? 300 : 800));
    last = await pfPostOnce(endpoint, body);
    if (!PfPro.shouldRetryPost(last, attempt)) break;
  }
  if (!last || !last.ok) throw new Error(PfPro.explainError(last && last.error, last && last.reason));
  return last;
}

async function flushPfQueue() {
  return withPfLock(async () => {
    const queue = await readPfQueue();
    if (!queue.length) { state.pending = 0; return; }
    if (!navigator.onLine) { state.pending = queue.length; return; }
    const remain = [];
    for (let i = 0; i < queue.length; i++) {
      let op = queue[i];
      try {
        const res = await pfPost(op.action, op.data, op.requestId);
        const txnId = PfPro.txnIdFromResponse(res);
        if ((op.action === "add_transaction" || op.action === "replace_transaction") && txnId) {
          rememberPfTxn(op.uid, txnId, op.requestId);
        }
        if (op.leg === "adv" && op.action === "add_transfer" && txnId) rememberAdvTxn(op.uid, txnId, op.requestId);
        if (op.voidAfter) {
          if (!txnId) throw new Error("PF Pro 沒有回傳交易編號，暫時無法刪除遠端那一筆");
          await pfPost("void_transaction", { txn_id: txnId, void_reason: "CostCode 刪除" }, op.voidRequestId || ("cc-" + op.uid + "-void"));
          if (op.leg === "adv") clearAdvMeta(op.uid);
          else clearExpenseMeta(op.uid);
        } else if (op.action === "void_transaction") {
          if (op.leg === "adv") clearAdvMeta(op.uid);
          else clearExpenseMeta(op.uid);
        } else if (op.action === "add_transfer") {
          savePayLog(loadPayLog().map((row) => row.requestId === op.requestId ? Object.assign({}, row, { state: "done" }) : row));
        }
      } catch (error) {
        if (op.voidAfter) {
          const meta = loadPfMeta()[op.uid] || {};
          const known = op.leg === "adv" ? ((meta.adv && meta.adv.txnId) || "") : (meta.txnId || "");
          if (known) {
            op = {
              kind: "void",
              uid: op.uid,
              leg: op.leg || "",
              action: "void_transaction",
              requestId: op.voidRequestId || ("cc-" + op.uid + "-void"),
              data: { txn_id: known, void_reason: "CostCode 刪除" },
              local: op.leg === "adv" ? null : { op: "deleteTx", uid: op.uid },
            };
          }
        }
        remain.push(op);
        for (let j = i + 1; j < queue.length; j++) remain.push(queue[j]);
        state.loadError = "有變更還沒寫入 PF Pro：" + messageOf(error);
        break;
      }
    }
    await kvSet("pfQueue", remain);
    state.pending = remain.length;
    if (!remain.length) state.loadError = "";
  });
}

function syncNow() {
  if (state.mode === "pfpro") return refreshPf();
  return refreshCloud();
}

async function refreshPf() {
  if (state.mode !== "pfpro") return;
  state.syncing = true;
  renderChrome();
  try {
    await flushPfQueue();
    if (navigator.onLine) {
      const data = await pfGet("accounts");
      state.pfAccounts = PfPro.normalizeAccounts(data.accounts);
      localStorage.setItem("pfAccounts", JSON.stringify(state.pfAccounts));
    }
    if (!state.pending) state.loadError = "";
  } catch (error) {
    state.loadError = messageOf(error);
  } finally {
    state.syncing = false;
    render();
  }
}

async function connectPfFromForm() {

  };

function disconnectPf() {

  const sheetToken = localStorage.getItem("apiToken") || "";
  if (sheetUrl && sheetToken && !window.confirm("中斷 PF Pro，並改顯示試算表裡的帳？手機上還沒同步的畫面會被試算表蓋過。")) return;
  localStorage.removeItem("pfApiUrl");
  localStorage.removeItem("pfApiToken");
  localStorage.removeItem("pfAccounts");
  state.pfAccounts = [];
  state.loadError = "";
  if (sheetUrl && sheetToken) {
    state.mode = "cloud";
    localStorage.setItem("ledgerMode", "cloud");
    toast("已改回試算表");
    render();
    refreshCloud();

async function refreshCloud() {
  if (state.mode !== "cloud") return;
  state.syncing = true;
  renderChrome();
  try {
    await flushQueue();
    if (!state.pending) {
      const data = await api("all", {}, 90000);
      state.data = normalizeData(data);
      state.backendVersion = data.version || state.backendVersion;
      state.loadError = "";
      await saveSnapshot();
    }
  } catch (error) {
    state.loadError = messageOf(error);
  } finally {
    state.syncing = false;
    render();
  }
}

async function connectFromForm() {
  const url = (document.getElementById("api-url").value || "").trim();
  const token = (document.getElementById("api-token").value || "").trim();
  const show = (text) => {
    const node = document.getElementById("api-error");
    if (node) node.textContent = text || "";
  };
  if (!isAllowedApiUrl(url)) { show("網址需要以 https:// 開頭"); return; }
  if (!token) { show("請貼上 TOKEN"); return; }
  show("連線中…");
  try {
    const creds = { url: url, token: token };
    const ping = await api("ping", {}, 20000, creds);
    const remote = normalizeData(await api("all", {}, 90000, creds));
    const hadLocal = state.mode !== "cloud" && (state.data.transactions.length || state.data.accounts.length);
    const remoteHas = remote.transactions.length || remote.accounts.length;
    if (remoteHas && hadLocal && !window.confirm("線上已經有帳。連線後會改顯示線上的資料。")) { show(""); return; }
    localStorage.setItem("apiUrl", url);
    localStorage.setItem("apiToken", token);
    localStorage.setItem("ledgerMode", "cloud");
    state.mode = "cloud";
    state.backendVersion = ping.version || "";
    if (!remoteHas && hadLocal && window.confirm("線上試算表還是空的。要把這台手機上的帳上傳嗎？")) {
      await uploadPrevious(state.data);
      return;
    }
    state.data = remote;
    state.loadError = "";
    state.pending = 0;
    await saveSnapshot();
    await kvSet("queue", []);
    state.tab = "ledger";
    show("");
    toast(remoteHas ? "已連上線上的帳" : "已連上，試算表還是空的");
    render();
  } catch (error) {
    show(messageOf(error));
  }
}

async function uploadPrevious(data) {
  const photos = [];
  for (let i = 0; i < data.transactions.length; i++) {
    const id = String(data.transactions[i].photoFileId || "");
    if (id.indexOf("local:") !== 0 && id.indexOf("pending:") !== 0) continue;
    const photo = await kvGet("photo:" + id);
    if (photo) photos.push({ uid: data.transactions[i].uid, name: photo.name || "photo.jpg", mime: photo.mime, base64: photo.base64, missing: false });
  }
  const bundle = {
    sig: "local-upload",
    accounts: data.accounts,
    projects: data.projects,
    categories: data.categories,
    receiptItems: data.receiptItems,
    photos: photos,
    transactions: data.transactions.map((tx) => Object.assign({}, tx, {
      photoFileId: String(tx.photoFileId || "").indexOf("local:") === 0 || String(tx.photoFileId || "").indexOf("pending:") === 0 ? "" : (tx.photoFileId || ""),
    })),
  };
  state.tab = "settings";
  importUi.phase = "uploading";
  render();
  await pushBundle(bundle, { clear: false, resume: false, sig: bundle.sig });
  const settingKeys = Object.keys(data.settings || {});
  for (let i = 0; i < settingKeys.length; i++) {
    if (settingKeys[i] === "demo") continue;
    await api("setSetting", { key: settingKeys[i], value: data.settings[settingKeys[i]] == null ? "" : String(data.settings[settingKeys[i]]) }, 30000);
  }
  localStorage.removeItem(CP_KEY);
  state.tab = "ledger";
  state.query = "";
  toast("手機上的帳已上傳");
  await refreshCloud();
}

function lastCategory(kind) {
  const main = categoryByLevel(state.data, localStorage.getItem("lastClass1") || "", "1");
  const sub = categoryByLevel(state.data, localStorage.getItem("lastClass2") || "", "2");
  if (!main || main.kind !== kind) return { class1: "", class2: "" };
  if (sub && String(sub.parentId) === String(main.id)) return { class1: String(main.id), class2: String(sub.id) };
  return { class1: String(main.id), class2: "" };
}

function defaultAccountId(tx) {
  if (pfActive()) {
    const accounts = PfPro.payAccounts(state.pfAccounts || []);
    const current = tx ? String(tx.accountId || "") : (localStorage.getItem("pfLastAccountId") || "");
    if (accounts.some((account) => account.id === current)) return current;
    return accounts[0] ? accounts[0].id : "";
  }
  const accounts = state.data.accounts;
  const current = tx ? String(tx.accountId || "") : (localStorage.getItem("lastAccountId") || "");
  if (accounts.some((account) => String(account.id) === current)) return current;
  return accounts[0] ? accounts[0].id : "";
}

function openForm(tx, preset) {
  const fallback = defaultAccountId(tx);
  const kind = tx ? tx.type : activeKind();
  const remembered = tx ? null : lastCategory(kind);
  const prior = tx && tx.uid ? (loadPfMeta()[tx.uid] || {}) : {};
  const priorAdvance = round2(prior.advance || 0);
  state.form = {
    editing: !!tx,
    uid: tx ? tx.uid : "",
    type: kind,
    amountStr: tx ? amountToStr(priorAdvance > 0 ? round2(Number(tx.amount) + priorAdvance) : tx.amount) : "",
    advanceStr: priorAdvance > 0 ? amountToStr(priorAdvance) : "",
    friendName: prior.friendName || "",
    class1: tx ? tx.class1 || "" : remembered.class1,
    class2: tx ? tx.class2 || "" : remembered.class2,
    accountId: tx ? tx.accountId || "" : fallback,
    projectId: tx && tx.projectId ? tx.projectId : (preset && preset.projectId) || "",
    date: tx && tx.date ? tx.date : (state.day || localISODate(new Date())),
    memo: tx && tx.memo ? tx.memo : "",
    invoiceId: tx && tx.invoiceId ? tx.invoiceId : "",
    photoData: "",
    photoName: "",
    photoFileId: tx && tx.photoFileId ? tx.photoFileId : "",
    createdAt: tx && tx.createdAt ? tx.createdAt : "",
    reimburse: !!prior.reimburse,
    saving: false,
  };
  if (pfActive()) {
    const main = categoryByLevel(state.data, state.form.class1, "1");
    const sub = categoryByLevel(state.data, state.form.class2, "2");
    if (!main || PfPro.mainHidden(main.name)) {
      state.form.class1 = "";
      state.form.class2 = "";
    } else if (sub && PfPro.subHidden(main.name, sub.name)) {
      state.form.class2 = "";
    }
  }
  state.overlay = { type: "form" };
  render();
}

async function saveProject() {
  if (!state.projectForm) state.projectForm = { name: "", memo: "" };
  const nameNode = document.getElementById("project-name");
  const memoNode = document.getElementById("project-memo");
  if (nameNode) state.projectForm.name = nameNode.value;
  if (memoNode) state.projectForm.memo = memoNode.value;
  const name = state.projectForm.name.trim();
  const memo = state.projectForm.memo.trim();
  const error = document.getElementById("project-error");
  const show = (text) => { if (error) error.textContent = text || ""; };
  if (!name) { show("請填專案名稱"); return; }
  if (state.data.projects.some((project) => project.name.trim() === name)) { show("已經有同名的專案"); return; }
  const project = publicProject({
    id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: name,
    memo: memo,
    color: "#1e4fd7",
    priority: 0,
  });

  state.overlay = null;
  state.projectForm = null;
  toast(result.queued ? "專案已記在這台手機，連線後上傳" : "已建立專案");
  render();

  else if (state.overlay.type === "cardpay") sheet.append(renderCardPay());
  else if (state.overlay.type === "repay") sheet.append(renderRepay());

function appendAccountOptions(select, accounts, selected) {
  const groups = [
    ["現金", accounts.filter((account) => account.type === "cash_wallet")],
    ["銀行", accounts.filter((account) => account.type === "bank_cash" || account.type === "bank_fx")],
    ["信用卡", accounts.filter((account) => account.type === "credit_card")],
  ];
  groups.forEach((group) => {
    if (!group[1].length) return;
    const box = el("optgroup", { label: group[0] });
    group[1].forEach((account) => {
      const option = el("option", { value: account.id }, account.name + " · " + account.id);
      if (String(account.id) === String(selected)) option.selected = true;
      box.append(option);
    });
    select.append(box);
  });
}

function visibleMains(kind) {
  const use = kind === "advance" ? "expense" : kind;
  return mainCats(state.data, use).filter((cat) => !pfActive() || !PfPro.mainHidden(cat.name));
}

function visibleSubs(parentId) {
  const subs = subCats(state.data, parentId);
  if (!pfActive()) return subs;
  const main = categoryByLevel(state.data, parentId, "1");
  return subs.filter((cat) => !PfPro.subHidden(main && main.name, cat.name));
}

function accountSelect() {
  const select = el("select", { id: "account-input", onChange: (event) => { state.form.accountId = event.target.value; } });
  if (pfActive()) {
    const accounts = PfPro.payAccounts(state.pfAccounts || []);
    if (!accounts.length) {
      select.append(el("option", { value: "" }, "尚未取得 PF Pro 帳戶"));
      return select;
    }
    appendAccountOptions(select, accounts, state.form.accountId);
    return select;
  }
  if (!state.data.accounts.length) {
    select.append(el("option", { value: "" }, "沒有帳戶"));
    return select;
  }
  state.data.accounts.forEach((account) => {
    const option = el("option", { value: account.id }, account.name);
    if (String(account.id) === String(state.form.accountId)) option.selected = true;
    select.append(option);
  });
  return select;
}

function projectSelect() {

function setType(type) {
  state.form.type = type;
  const kind = type === "advance" ? "expense" : type;
  const cat = categoryByLevel(state.data, state.form.class1, "1");
  if (!cat || cat.kind !== kind) {
    state.form.class1 = "";
    state.form.class2 = "";
  }
  if (type === "income") {
    state.form.advanceStr = "";
    state.form.friendName = "";
    const advanceInput = document.getElementById("advance-input");
    const friendInput = document.getElementById("friend-input");
    if (advanceInput) advanceInput.value = "";
    if (friendInput) friendInput.value = "";
  }
  paintType();
  paintAmount();
  paintFrequent();
  paintCats();
  paintSubs();
}

function paintType() {
  ["expense", "income", "advance"].forEach((type) => {
    const button = document.getElementById("type-" + type);
    if (button && state.form) button.setAttribute("aria-pressed", state.form.type === type ? "true" : "false");
  });
}

function paintAmount() {
  const node = document.getElementById("amount-display");
  if (!node || !state.form) return;
  const text = state.form.amountStr || "";
  node.classList.toggle("income", state.form.type === "income" && !!text);
  node.classList.toggle("expense", state.form.type !== "income" && !!text);
  if (!text) {
    node.textContent = "0";
    node.classList.add("is-empty");
    return;
  }
  node.classList.remove("is-empty");
  const parts = text.split(".");
  const shown = formatMoney(Number(parts[0] || "0"));
  node.textContent = parts.length > 1 ? shown + "." + parts[1] : shown;
  paintAdvance();
}

function pushDigit(key) {
  let text = state.form.amountStr || "";
  if (key === "⌫" || key === "←") { state.form.amountStr = text.slice(0, -1); return; }
  if (key === ".") {
    if (text.indexOf(".") >= 0) return;
    state.form.amountStr = (text || "0") + ".";
    return;
  }
  if (text === "0") text = "";
  const next = text + key;
  const parts = next.split(".");
  if (parts[0].length > 9) return;
  if (parts[1] && parts[1].length > 2) return;
  state.form.amountStr = next;
}

function paintFrequent() {
  const host = document.getElementById("frequent");
  const label = document.getElementById("frequent-label");
  if (!host || !state.form) return;
  const pairs = frequentPairs(state.data, state.form.type === "advance" ? "expense" : state.form.type, new Date(), 120).filter((pair) => {
    if (!pfActive()) return true;
    const picked = pairLabel(state.data, pair[0]);
    const main = categoryByLevel(state.data, picked.class1, "1");
    const sub = picked.class2 ? categoryByLevel(state.data, picked.class2, "2") : null;
    if (main && PfPro.mainHidden(main.name)) return false;
    if (sub && main && PfPro.subHidden(main.name, sub.name)) return false;
    return true;
  });
  host.hidden = !pairs.length;
  if (label) label.hidden = !pairs.length;
  if (!pairs.length) {
    host.replaceChildren();
    return;
  }
  host.replaceChildren.apply(host, pairs.map((pair) => {
    const label = pairLabel(state.data, pair[0]);
    const pressed = String(state.form.class1) === label.class1 && String(state.form.class2 || "") === label.class2;
    return el("button", { type: "button", class: "chip", "aria-pressed": pressed ? "true" : "false", onClick: () => selectPair(label.class1 + "|" + label.class2) },
      iconFor(label.icon, label.iconName) + " " + label.name);
  }));
}

function paintCats() {
  const host = document.getElementById("cat-grid");
  if (!host || !state.form) return;
  const cats = visibleMains(state.form.type);
  if (!cats.length) {
    host.replaceChildren(el("p", { class: "muted" }, "還沒有這個類型的分類"));
    return;
  }
  host.replaceChildren.apply(host, cats.map((cat) => el("button", {
    type: "button", class: "cat", "data-cat": cat.id,
    "aria-pressed": String(cat.id) === String(state.form.class1) ? "true" : "false",
    onClick: () => selectCategory("1", cat.id),
  }, el("span", { class: "emoji", "aria-hidden": "true" }, iconFor(cat.icon, cat.name)), el("span", {}, cat.name))));
}

function paintPicked() {
  const node = document.getElementById("picked");
  if (!node || !state.form) return;
  const main = categoryByLevel(state.data, state.form.class1, "1");
  const sub = categoryByLevel(state.data, state.form.class2, "2");
  if (main || sub) node.textContent = [main && main.name, sub && sub.name].filter(Boolean).join(" · ");
  else node.textContent = state.form.type === "advance" ? "分類可留空，會寫進代墊說明" : "先選分類";
}

function paintReimburse() {
  const wrap = document.getElementById("reimburse-wrap");
  if (!wrap || !state.form) return;
  const main = categoryByLevel(state.data, state.form.class1, "1");
  const sub = categoryByLevel(state.data, state.form.class2, "2");
  const decision = main && pfActive() && state.form.type === "expense" ? PfPro.resolveCategory(main.name, sub && sub.name, "expense") : null;
  const advance = formAdvanceAmount();
  const mine = round2(parseAmount(state.form.amountStr) - advance);
  const show = !!(decision && decision.ok && decision.category === "工作" && mine > 0);
  wrap.hidden = !show;
  if (!show) state.form.reimburse = false;
}

function paintSubs() {
  paintPicked();
  paintReimburse();
  const host = document.getElementById("subs");
  if (!host || !state.form) return;
  const subs = visibleSubs(state.form.class1);
  host.replaceChildren.apply(host, subs.map((cat) => el("button", {
    type: "button", class: "chip",
    "aria-pressed": String(cat.id) === String(state.form.class2) ? "true" : "false",
    onClick: () => selectCategory("2", cat.id),
  }, cat.name)));
}

function selectCategory(level, id) {
  if (level === "1") {
    state.form.class1 = id;
    const subs = visibleSubs(id);
    if (!subs.some((cat) => String(cat.id) === String(state.form.class2))) state.form.class2 = subs.length === 1 ? subs[0].id : "";
  } else {
    const picked = resolveSubSelection(state.data, id);
    if (!picked) return;
    state.form.class2 = picked.class2;
    state.form.class1 = picked.class1;
  }
  paintFrequent();
  paintCats();
  paintSubs();
  paintFormError("");
}

function selectPair(key) {
  const bits = key.split("|");
  state.form.class1 = bits[0];
  state.form.class2 = bits[1] || "";
  paintFrequent();
  paintCats();
  paintSubs();
}

function friendsAccountNote() {
  if (!pfActive() || !window.PfPro) return "";
  if (!(state.pfAccounts || []).length) return "PF Pro 需要已有帳戶 " + PfPro.AR_FRIENDS + "（" + PfPro.AR_FRIENDS_NAME + "）。";
  if (!PfPro.hasFriendsAccount(state.pfAccounts)) return "帳戶清單裡還沒有 " + PfPro.AR_FRIENDS + "（" + PfPro.AR_FRIENDS_NAME + "）。請先在 PF Pro 建立這個應收帳戶。";
  return "朋友的份從同一個帳戶轉到 " + PfPro.AR_FRIENDS_NAME + "，不算進自己的支出。";
}

function formAdvanceAmount() {
  if (!pfActive() || !state.form || state.form.type === "income") return 0;
  if (state.form.type === "advance") return parseAmount(state.form.amountStr);
  return parseAmount(state.form.advanceStr);
}

function paintAdvance() {
  const box = document.getElementById("advance-box");
  const amountRow = document.getElementById("advance-amount-row");
  const label = document.getElementById("amount-label");
  const hint = document.getElementById("advance-hint");
  const missing = document.getElementById("advance-missing");
  const save = document.getElementById("save-tx");
  if (!state.form) return;
  const show = pfActive() && state.form.type !== "income";
  if (box) box.hidden = !show;
  if (amountRow) amountRow.hidden = !show || state.form.type === "advance";
  if (label) {
    if (state.form.type === "advance") label.textContent = "代墊金額";
    else if (pfActive() && state.form.type === "expense") label.textContent = "刷卡／付現總額";
    else label.textContent = "金額";
  }
  if (save && !state.form.saving) save.textContent = state.form.type === "advance" ? "記一筆代墊" : (state.form.editing ? "儲存修改" : "記上一筆");
  if (missing) missing.textContent = show ? friendsAccountNote() : "";
  if (!hint) return;
  if (!show) { hint.textContent = ""; return; }
  const total = parseAmount(state.form.amountStr);
  const advance = state.form.type === "advance" ? total : parseAmount(state.form.advanceStr);
  if (state.form.type === "advance") {
    hint.textContent = "整筆都算朋友的，會轉到應收，不留在週檢視。";
    return;
  }
  if (!(advance > 0)) {
    hint.textContent = "有幫朋友付時填金額。我的份 = 總額 − 代墊。";
    return;
  }
  if (round2(advance) > total) {
    hint.textContent = "代墊金額不能大於刷卡或付現的總額。";
    return;
  }
  const mine = round2(total - advance);
  if (mine === 0) hint.textContent = "整筆都是代墊，不會算進自己的支出。";
  else hint.textContent = "我的份 " + formatMoney(mine) + " 元，朋友 " + formatMoney(advance) + " 元。";
}

function paintFormError(message) {
  const node = document.getElementById("form-error");
  if (node) node.textContent = message || "";
}

function readFormDom() {
  ["date-input", "account-input", "project-input", "memo-input"].forEach((id) => {
    const node = document.getElementById(id);
    if (!node || !state.form) return;
    if (id === "date-input") state.form.date = node.value;
    if (id === "account-input") state.form.accountId = node.value;
    if (id === "project-input") state.form.projectId = node.value;
    if (id === "memo-input") state.form.memo = node.value;
  });
  const reimburse = document.getElementById("reimburse-input");
  const reimburseWrap = document.getElementById("reimburse-wrap");
  if (reimburse && reimburseWrap && state.form && !reimburseWrap.hidden) state.form.reimburse = reimburse.checked;
  const advance = document.getElementById("advance-input");
  const friend = document.getElementById("friend-input");
  if (advance && state.form && state.form.type === "expense") state.form.advanceStr = advance.value;
  if (friend && state.form && state.form.type !== "income") state.form.friendName = friend.value;
}

function parseAmount(value) {
  const text = String(value || "").replace(/,/g, "");
  if (!text || text === ".") return 0;
  return round2(text);
}

function validateForm() {
  const total = parseAmount(state.form.amountStr);
  if (!(total > 0)) return "請輸入金額";
  if (!state.form.date) return "請選擇日期";
  const advance = formAdvanceAmount();
  if (pfActive() && round2(advance) > total) return "代墊金額不能大於刷卡或付現的總額";
  if (pfActive() && advance > 0 && !String(state.form.friendName || "").trim()) return "請填朋友名字";
  if (pfActive()) {
    const accounts = PfPro.payAccounts(state.pfAccounts || []);
    if (!accounts.length) return "請先到設定連上 PF Pro，讀取帳戶";
    if (!accounts.some((account) => account.id === String(state.form.accountId))) return "請選擇 PF Pro 帳戶";
    const chosen = accounts.find((account) => account.id === String(state.form.accountId));
    if (chosen && chosen.currency && chosen.currency !== "TWD") return "PF Pro 快速記帳目前只寫台幣帳戶";
  } else if (!state.form.accountId) return "請選擇帳戶";
  const mine = round2(total - (advance > 0 ? advance : 0));
  const wholeFriend = pfActive() && advance > 0 && mine === 0;
  if (!wholeFriend && !state.form.class1) return "請選擇分類";
  if (state.form.class1) {
    const subs = visibleSubs(state.form.class1);
    if (subs.length && !subs.some((cat) => String(cat.id) === String(state.form.class2))) return "請再選子分類";
  }
  if (pfActive() && mine > 0) {
    const main = categoryByLevel(state.data, state.form.class1, "1");
    const sub = categoryByLevel(state.data, state.form.class2, "2");
    const decision = PfPro.resolveCategory(main && main.name, sub && sub.name, state.form.type === "income" ? "income" : "expense");
    if (!decision.ok) return decision.error;
  }
  return "";
}

function onPhoto(event) {
  const file = event.target.files && event.target.files[0];
  if (!file || !state.form) return;
  if (file.size > 4 * 1024 * 1024) { paintFormError("照片請小於 4MB"); return; }
  const reader = new FileReader();
  reader.onload = () => {
    state.form.photoData = String(reader.result || "");
    state.form.photoName = file.name;
    const preview = document.getElementById("photo-preview");
    const note = document.getElementById("photo-note");
    if (preview) preview.replaceChildren(el("img", { alt: "照片預覽", src: state.form.photoData }));
    if (note) note.textContent = file.name;
  };
  reader.readAsDataURL(file);
}

function splitDataUrl(url) {
  const match = /^data:([^;]+);base64,(.*)$/.exec(url || "");
  return match ? { mime: match[1], base64: match[2] } : { mime: "image/jpeg", base64: String(url || "") };
}

async function storePhoto(form, uid) {
  const parts = splitDataUrl(form.photoData);
  if (state.mode !== "cloud" || !navigator.onLine) {
    const id = (state.mode === "cloud" ? "pending:" : "local:") + uid;
    await kvSet("photo:" + id, { mime: parts.mime, base64: parts.base64, name: form.photoName || "photo.jpg" });
    return id;
  }
  const uploaded = await api("uploadPhoto", { name: form.photoName || uid + ".jpg", mime: parts.mime, base64: parts.base64 }, 60000);
  return uploaded.fileId;
}

async function saveForm() {
  if (!state.form || state.form.saving) return;
  readFormDom();
  const error = validateForm();
  paintFormError(error);
  if (error) return;
  state.form.saving = true;
  const button = document.getElementById("save-tx");
  if (button) { button.disabled = true; button.textContent = "儲存中…"; }
  try {
    if (!state.form.uid) state.form.uid = "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const now = PfPro.taipeiStamp(new Date());
    const draft = {
      uid: state.form.uid,
      date: state.form.date,
      type: state.form.type === "income" ? "income" : "expense",
      amount: parseAmount(state.form.amountStr),
      accountId: state.form.accountId,
      class1: state.form.class1,
      class2: state.form.class2 || "",
      memo: state.form.memo || "",
    };
    const preview = pfActive() ? previewPfSplit(draft) : null;
    if (preview && !preview.ok) throw new Error(preview.error);
    let photoFileId = state.form.photoFileId || "";
    if (state.form.photoData && !(preview && preview.wholeAdvance)) photoFileId = await storePhoto(state.form, state.form.uid);
    const row = publicTx({
      uid: state.form.uid,
      date: state.form.date,
      type: state.form.type,
      amount: parseAmount(state.form.amountStr),
      accountId: state.form.accountId,
      class1: state.form.class1,
      class2: state.form.class2 || "",
      projectId: state.form.projectId || "",
      memo: state.form.memo || "",
      invoiceId: state.form.invoiceId || "",
      photoFileId: photoFileId,
      createdAt: state.form.createdAt || now,
      modifiedAt: now,
    });
    const result = await commit({ op: "upsertTx", row: row });
    if (pfActive()) localStorage.setItem("pfLastAccountId", row.accountId);
    else localStorage.setItem("lastAccountId", row.accountId);
    localStorage.setItem("lastClass1", row.class1 || "");
    localStorage.setItem("lastClass2", row.class2 || "");
    if (String(state.data.settings.demo) === "1") {
      delete state.data.settings.demo;
      await saveSnapshot();
    }
    state.overlay = null;
    state.form = null;
    focusDay(row.date || localISODate(new Date()));
    state.ledgerKind = row.type === "income" ? "income" : "expense";
    state.query = "";
    const queued = !!result.queued;
    let message = queued ? "已記在這台手機，連線後上傳" : (row.createdAt === now ? "已記上一筆" : "已儲存");
    if (result.plan && result.plan.wholeAdvance) message = queued ? "代墊已留在這台手機，連線後寫入" : "已記一筆代墊";
    else if (result.plan && result.plan.advance > 0) message = queued ? "已記在這台手機，連線後上傳" : "已記上一筆，朋友的份另記代墊";
    toast(message);
    render();
  } catch (error) {
    state.form.saving = false;
    if (button) { button.disabled = false; button.textContent = state.form.type === "advance" ? "記一筆代墊" : (state.form.editing ? "儲存修改" : "記上一筆"); }
    paintFormError(messageOf(error));
  }
}

async function removeTx(uid) {
  if (!window.confirm("刪除這筆帳？")) return;
  const result = await commit({ op: "deleteTx", uid: uid });
  state.overlay = null;
  state.form = null;
  toast(result.queued ? "已在手機上刪除，連線後同步" : "已刪除");
  render();
}

function displayAccountName(id) {
  const local = findById(state.data.accounts, id);
  if (local && local.name) return local.name;
  const remote = (state.pfAccounts || []).find((account) => String(account.id) === String(id));
  if (remote && remote.name) return remote.name;
  return id ? String(id) : "";
}

function openCardPay() {
  if (!pfActive()) {
    state.settingsFocus = "pfpro";
    state.tab = "settings";
    toast("請先連上 PF Pro");
    render();
    return;
  }
  const banks = PfPro.bankAccounts(state.pfAccounts || []);
  const cards = PfPro.cardAccounts(state.pfAccounts || []);
  const lastBank = localStorage.getItem("pfLastBankId") || "";
  const lastCard = localStorage.getItem("pfLastCardId") || "";

    date: state.day || localISODate(new Date()),

    fromId: banks.some((account) => account.id === lastBank) ? lastBank : (banks[0] ? banks[0].id : ""),
    toId: cards.some((account) => account.id === lastCard) ? lastCard : (cards[0] ? cards[0].id : ""),
    memo: "",
    saving: false,
  };

function readCardPayDom() {
  if (!state.cardPay) return;
  const date = document.getElementById("pay-date");
  const amount = document.getElementById("pay-amount");
  const from = document.getElementById("pay-from");
  const to = document.getElementById("pay-to");
  const memo = document.getElementById("pay-memo");

  if (amount) state.cardPay.amount = amount.value;
  if (from) state.cardPay.fromId = from.value;
  if (to) state.cardPay.toId = to.value;
  if (memo) state.cardPay.memo = memo.value;
}

function paintCardError(message) {
  const node = document.getElementById("pay-error");
  if (node) node.textContent = message || "";
}

function renderCardPay() {

  const banks = PfPro.bankAccounts(state.pfAccounts || []);
  const cards = PfPro.cardAccounts(state.pfAccounts || []);
  const from = el("select", { id: "pay-from", onChange: (event) => { state.cardPay.fromId = event.target.value; } });
  const to = el("select", { id: "pay-to", onChange: (event) => { state.cardPay.toId = event.target.value; } });

}

async function saveCardPay() {
  if (!state.cardPay || state.cardPay.saving) return;
  readCardPayDom();
  const banks = PfPro.bankAccounts(state.pfAccounts || []);
  const cards = PfPro.cardAccounts(state.pfAccounts || []);
  const from = banks.find((account) => account.id === state.cardPay.fromId);
  const to = cards.find((account) => account.id === state.cardPay.toId);
  if (!from) { paintCardError("請選銀行帳戶"); return; }
  if (!to) { paintCardError("請選信用卡"); return; }
  const uid = "pay" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const plan = PfPro.planTransfer({
    uid: uid,
    date: state.cardPay.date,
    amount: parseAmount(state.cardPay.amount),
    fromId: from.id,
    toId: to.id,
    fromType: from.type,
    toType: to.type,
    currency: from.currency,
    toCurrency: to.currency,
    memo: state.cardPay.memo,
  });
  if (!plan.ok) { paintCardError(plan.error); return; }
  state.cardPay.saving = true;
  const button = document.getElementById("save-pay");
  if (button) button.disabled = true;
  try {
    await enqueuePfTransfer(plan, {
      date: state.cardPay.date,
      amount: parseAmount(state.cardPay.amount),
      fromName: from.name,
      toName: to.name,
    });
    localStorage.setItem("pfLastBankId", from.id);
    localStorage.setItem("pfLastCardId", to.id);
    if (navigator.onLine) await flushPfQueue();
    const queued = state.pending > 0;
    state.overlay = null;
    state.cardPay = null;
    toast(queued ? "繳卡費已留在這台手機，連線後寫入" : "已記一筆繳卡費");
    render();
  } catch (error) {
    if (state.cardPay) state.cardPay.saving = false;

async function saveRepay() {
  if (!state.repay || state.repay.saving) return;
  readRepayDom();

  const to = accounts.find((account) => account.id === state.repay.toId);

  const uid = "repay" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const plan = PfPro.planRepay({
    uid: uid,

    toType: to.type,
    currency: to.currency,
    friendName: state.repay.friendName,
  });
  if (!plan.ok) { paintRepayError(plan.error); return; }
  state.repay.saving = true;
  const button = document.getElementById("save-repay");

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = src;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error("無法載入解析程式，請確認可以連到 cdnjs。"));
    document.head.appendChild(script);
  });
}

function ensureLibs() {
  if (window.JSZip && window.initSqlJs) return Promise.resolve();
  if (!libPromise) {
    libPromise = Promise.all([
      loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"),
      loadScript("https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"),
    ]).catch((error) => { libPromise = null; throw error; });
  }
  return libPromise;
}

function sqlObjects(db, table) {
  const allowed = { main: 1, accounts: 1, projects: 1, finclass1: 1, finclass2: 1, currencylist: 1 };
  if (!allowed[table]) return [];
  let result;
  try { result = db.exec("SELECT * FROM " + table); }
  catch (error) { return []; }
  if (!result || !result.length) return [];
  return result[0].values.map((values) => {
    const row = {};
    result[0].columns.forEach((col, index) => { row[String(col).toLowerCase()] = values[index]; });
    return row;
  });
}

async function parseCddb(file, onStatus) {
  onStatus("正在讀取備份…");
  await ensureLibs();
  if (!window.JSZip || !window.initSqlJs) throw new Error("解析程式沒有載入。請確認可以連到 cdnjs。");
  const zip = await window.JSZip.loadAsync(await file.arrayBuffer());
  const paths = [];
  let dbPath = "";
  zip.forEach((path, entry) => {
    if (entry.dir) return;
    paths.push(path);
    if (/fin\.db$/i.test(path)) dbPath = path;
  });
  if (!dbPath) throw new Error("找不到 db/fin.db。請確認這是 CostDiary 的 .cddb 備份。");
  onStatus("正在讀取帳務資料庫…");
  const SQL = await window.initSqlJs({ locateFile: () => "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.wasm" });
  const database = new SQL.Database(await zip.file(dbPath).async("uint8array"));
  try {
    const accounts = sqlObjects(database, "accounts").map((row) => mapAccount(row, sqlObjects(database, "currencylist"))).filter(Boolean);
    const projects = sqlObjects(database, "projects").map(mapProject).filter(Boolean);
    const categories = inheritKind(sqlObjects(database, "finclass1").map(mapClass1).concat(sqlObjects(database, "finclass2").map(mapClass2)).filter(Boolean));
    const skipped = { deleted: 0, transfer: 0, badDate: 0, badId: 0 };
    const transactions = [];
    sqlObjects(database, "main").forEach((row) => {
      const mapped = mapMainRow(row);
      if (mapped.skip) skipped[mapped.skip] = (skipped[mapped.skip] || 0) + 1;
      else if (mapped.tx) transactions.push(mapped.tx);
    });
    onStatus("正在讀取發票…");
    let badReceipt = 0;
    const receiptItems = [];
    for (let i = 0; i < paths.length; i++) {
      const id = receiptPathId(paths[i]);
      if (!id) continue;
      try { receiptItems.push.apply(receiptItems, mapReceipt(id, await zip.file(paths[i]).async("string"))); }
      catch (error) { badReceipt += 1; }
    }
    return { accounts: accounts, projects: projects, categories: categories, transactions: transactions, receiptItems: receiptItems, photos: planPhotos(paths, transactions), skipped: skipped, badReceipt: badReceipt, zip: zip };
  } finally {
    database.close();
  }
}

async function onPickFile(file) {
  importUi.phase = "parsing";
  importUi.error = "";
  importUi.summary = null;
  importUi.message = "正在解析…";

  paintImportStatus();
  try {
    const parsed = await parseCddb(file, (message) => { importUi.message = message; paintImportStatus(); });
    parsed.sig = [file.name, file.size, file.lastModified].join("|");
    importBundle = parsed;
    importUi.summary = {
      transactions: parsed.transactions.length,
      receiptItems: parsed.receiptItems.length,
      categories: parsed.categories.length,
      accounts: parsed.accounts.length,
      projects: parsed.projects.length,
      photos: parsed.photos.filter((photo) => !photo.missing).length,
      missingPhotos: parsed.photos.filter((photo) => photo.missing).length,
      skipped: parsed.skipped,
      badReceipt: parsed.badReceipt,
    };
    const checkpoint = loadCheckpoint();
    importUi.resume = !!(checkpoint && checkpoint.sig === parsed.sig);
    importUi.phase = "ready";
    importUi.message = "";
  } catch (error) {
    importBundle = null;
    importUi.phase = "error";
    importUi.error = messageOf(error);
  }
  paintImportStatus();
}

function paintImportStatus() {
  const host = document.getElementById("import-status");
  if (!host) return;
  const nodes = [];
  if (importUi.phase === "parsing" || importUi.phase === "uploading") {
    nodes.push(el("p", {}, importUi.message || (importUi.phase === "parsing" ? "正在解析…" : "上傳中…")));
    if (importUi.phase === "uploading") nodes.push(el("p", { class: "muted" }, "請留在這個分頁。若中斷，再選一次同一個檔就能接續。"));
  }
  if (importUi.error) nodes.push(el("p", { class: "bad" }, importUi.error));
  if (importUi.summary && importBundle && importUi.phase !== "parsing") {
    const summary = importUi.summary;
    nodes.push(el("ul", { class: "counts" },
      el("li", {}, "交易 " + summary.transactions + " 筆"),
      el("li", {}, "發票品項 " + summary.receiptItems + " 筆"),
      el("li", {}, "分類 " + summary.categories + "、帳戶 " + summary.accounts + "、專案 " + summary.projects),
      el("li", {}, "可上傳照片 " + summary.photos + " 張" + (summary.missingPhotos ? "，缺檔 " + summary.missingPhotos + " 張" : "")),
      el("li", {}, "略過已刪除 " + (summary.skipped.deleted || 0) + "、轉帳 " + (summary.skipped.transfer || 0) + (summary.badReceipt ? "、讀不到的發票檔 " + summary.badReceipt : ""))));
  }
  if (importUi.phase === "error" && importBundle && state.mode === "cloud") {
    nodes.push(el("button", { type: "button", class: "primary", id: "import-go", onClick: go(() => runImportClick("resume")) }, "從中斷的地方繼續"));
  } else if (importUi.phase === "ready" && importBundle) {
    if (importUi.resume && state.mode === "cloud") {
      nodes.push(el("p", {}, "這個檔案上次傳到一半。"));
      nodes.push(el("button", { type: "button", class: "primary", id: "import-go", onClick: go(() => runImportClick("resume")) }, "繼續上傳"));
      nodes.push(el("button", { type: "button", class: "secondary", onClick: go(() => runImportClick("restart")) }, "重新從頭上傳"));
    } else {
      nodes.push(el("button", { type: "button", class: "primary", id: "import-go", onClick: go(() => runImportClick("go")) }, state.mode === "cloud" ? "開始寫入" : "載入到這台手機"));
    }
  } else if (importUi.phase === "idle") {
    nodes.push(el("p", { class: "muted" }, "選擇備份後會先顯示筆數，確認了才寫入。"));
  }
  host.replaceChildren.apply(host, nodes);
}

async function runImportClick(mode) {
  if (!importBundle || importUi.phase === "uploading" || importUi.phase === "parsing") return;
  if (state.mode === "local" || state.mode === "pfpro") { await importLocal(importBundle); return; }
  if (state.mode !== "cloud") { toast("請先連上試算表，或改用本機試用"); return; }
  const resume = mode === "resume";
  const clear = false;
  importUi.phase = "uploading";
  importUi.error = "";
  paintImportStatus();
  try {
    await flushQueue();
    if (state.pending) throw new Error("還有變更沒上傳。請先按立即上傳。");
    await pushBundle(importBundle, { clear: !!clear, resume: resume, sig: importBundle.sig });
    localStorage.removeItem(CP_KEY);
    const count = importBundle.transactions.length;
    importBundle = null;
    importUi.phase = "done";
    importUi.summary = null;
    toast("已寫入 " + count + " 筆");
    state.tab = "ledger";
    await refreshCloud();
  } catch (error) {
    importUi.phase = "error";
    importUi.error = messageOf(error);
    importUi.resume = true;
    state.syncing = false;
    renderChrome();
    paintImportStatus();
  }
}

async function importLocal(bundle) {
  const budget = state.data.settings.monthlyBudget || "";
  const next = normalizeData({
    transactions: bundle.transactions,
    accounts: bundle.accounts,
    projects: bundle.projects,
    categories: bundle.categories,
    receiptItems: bundle.receiptItems,
    settings: { monthlyBudget: budget },
  });
  for (let i = 0; i < (bundle.photos || []).length; i++) {
    const photo = bundle.photos[i];
    if (photo.missing || !bundle.zip) continue;
    const entry = bundle.zip.file(photo.path);
    if (!entry) continue;
    const id = "local:" + photo.uid;
    await kvSet("photo:" + id, { mime: mimeFromName(photo.name), base64: await entry.async("base64"), name: photo.name });
    const tx = next.transactions.find((item) => item.uid === photo.uid);
    if (tx) tx.photoFileId = id;
  }
  state.data = next;
  await saveSnapshot();
  importBundle = null;
  importUi.phase = "idle";
  importUi.summary = null;
  focusDay(localISODate(new Date()));
  state.ledgerKind = "expense";
  state.tab = "ledger";
  toast("已載入 " + next.transactions.length + " 筆到這台手機");
  render();
}

function mimeFromName(name) {
  if (/\.png$/i.test(name || "")) return "image/png";
  if (/\.gif$/i.test(name || "")) return "image/gif";
  if (/\.webp$/i.test(name || "")) return "image/webp";
  return "image/jpeg";
}

function loadCheckpoint() {
  try { return JSON.parse(localStorage.getItem(CP_KEY) || "null"); }
  catch (error) { return null; }
}

function saveCheckpoint(checkpoint) {
  try { localStorage.setItem(CP_KEY, JSON.stringify(checkpoint)); }
  catch (error) {}
}

function reportImport(message) {
  importUi.message = message;
  state.syncing = true;
  renderChrome();
  paintImportStatus();
}

async function pushBundle(bundle, options) {
  let checkpoint = options.resume ? loadCheckpoint() : null;
  if (!checkpoint || checkpoint.sig !== options.sig) checkpoint = { sig: options.sig, cleared: false, progress: {} };
  if (options.clear) throw new Error("清空試算表已停用");
  const stages = [
    ["accounts", "Accounts", bundle.accounts, accountToRow, "帳戶"],
    ["projects", "Projects", bundle.projects, projectToRow, "專案"],
    ["categories", "Categories", bundle.categories, categoryToRow, "分類"],
    ["transactions", "Transactions", bundle.transactions, txToRow, "交易"],
    ["receiptItems", "ReceiptItems", bundle.receiptItems, itemToRow, "發票品項"],
  ];
  for (let s = 0; s < stages.length; s++) {
    const key = stages[s][0];
    const rows = stages[s][2].map(stages[s][3]);
    let index = checkpoint.progress[key] || 0;
    while (index < rows.length) {
      const chunk = rows.slice(index, index + BATCH_SIZE);
      reportImport(stages[s][4] + " " + Math.min(index + chunk.length, rows.length) + " / " + rows.length);
      await api("append", { sheet: stages[s][1], rows: chunk }, 90000);
      index += chunk.length;
      checkpoint.progress[key] = index;
      saveCheckpoint(checkpoint);
    }
  }
  const photos = bundle.photos || [];
  for (let i = 0; i < photos.length; i++) {
    const photo = photos[i];
    if (photo.missing || checkpoint.progress["photo:" + photo.uid]) continue;
    let base64 = photo.base64 || "";
    if (!base64 && bundle.zip && photo.path) {
      const entry = bundle.zip.file(photo.path);
      if (entry) base64 = await entry.async("base64");
    }
    if (!base64) continue;
    reportImport("上傳照片 " + photo.name);
    const uploaded = await api("uploadPhoto", { name: photo.uid + "-" + photo.name, mime: photo.mime || mimeFromName(photo.name), base64: base64 }, 60000);
    const tx = bundle.transactions.find((item) => item.uid === photo.uid);
    if (tx) {
      const row = publicTx(tx);
      row.photoFileId = uploaded.fileId;
      await api("upsertTx", { row: row }, 60000);
    }
    checkpoint.progress["photo:" + photo.uid] = uploaded.fileId;
    saveCheckpoint(checkpoint);
  }
  state.syncing = false;
}

async function boot() {
  state.online = navigator.onLine;
  try {
    const snap = await kvGet("snapshot");
    if (snap && typeof snap === "object") state.data = normalizeData(snap);
    const queue = (await kvGet("queue")) || [];
    const pfQueue = (await kvGet("pfQueue")) || [];
    state.sheetPending = queue.length;
    queue.forEach((op) => applyOp(state.data, op));
    pfQueue.forEach((op) => { if (op && op.local) applyOp(state.data, op.local); });
    state.pfQueueBoot = pfQueue.length;
  } catch (error) {
    state.loadError = "讀不到這台手機上的備份";
  }
  const url = (localStorage.getItem("apiUrl") || "").trim();
  const token = localStorage.getItem("apiToken") || "";
  const pfUrl = (localStorage.getItem("pfApiUrl") || "").trim();
  const pfToken = localStorage.getItem("pfApiToken") || "";
  const savedMode = localStorage.getItem("ledgerMode") || "";
  if (savedMode === "pfpro" && pfUrl && pfToken) state.mode = "pfpro";
  else if (url && token) state.mode = "cloud";
  else if (savedMode === "local") state.mode = "local";
  else state.mode = "unset";
  state.pfAccounts = loadPfAccountCache();
  state.pending = state.mode === "pfpro" ? (state.pfQueueBoot || 0) : (state.sheetPending || 0);
  focusDay(localISODate(new Date()));
  state.booting = false;
  render();
  if (state.mode === "cloud") refreshCloud();
  else if (state.mode === "pfpro") refreshPf();
}

document.getElementById("fab").addEventListener("click", () => openForm(null));
document.getElementById("tabbar").addEventListener("click", (event) => {
  const button = event.target.closest("[data-tab]");
  if (!button) return;
  state.tab = button.dataset.tab;
  state.overlay = null;
  render();
});
document.getElementById("topbar").addEventListener("click", (event) => {
  if (event.target.closest("#month-prev")) state.month = shiftMonth(state.month, -1);
  else if (event.target.closest("#month-next")) state.month = shiftMonth(state.month, 1);
  else return;
  state.query = "";
  render();
});
document.addEventListener("keydown", (event) => {
  if (!state.overlay) {
    if (event.key === "Escape") return;
    return;
  }
  if (event.key === "Escape") { closeSheet(); return; }
  if (!state.form || state.overlay.type !== "form") return;
  if (event.target.closest && event.target.closest("input, textarea, select")) return;
  if (/^[0-9.]$/.test(event.key) || event.key === "Backspace") {
    event.preventDefault();
    pushDigit(event.key === "Backspace" ? "⌫" : event.key);
    paintAmount();
  } else if (event.key === "Enter") {
    event.preventDefault();
    saveForm();
  }
});
window.addEventListener("online", () => { state.online = true; if (state.mode === "cloud" || state.mode === "pfpro") syncNow(); else render(); });
window.addEventListener("offline", () => { state.online = false; render(); });
window.addEventListener("error", (event) => {
  const view = document.getElementById("view");
  if (state.booting && view) view.textContent = "畫面打不開：" + (event.message || "");
});
if (!Element.prototype.replaceChildren) {
  Element.prototype.replaceChildren = function () {
    while (this.firstChild) this.removeChild(this.firstChild);
    this.append.apply(this, arguments);
  };
}
boot().catch((error) => {
  const view = document.getElementById("view");
  if (view) view.textContent = "畫面打不開：" + messageOf(error);
});
</script>
</body>
</html>
